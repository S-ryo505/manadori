<style>

  --pri:#4B5BD6; --pri-soft:#E9EBFB; --pri-ink:#FFFFFF;

html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","BIZ UDPGothic",sans-serif;
  font-size:16px;line-height:1.65;min-height:100dvh;

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
#app{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:.02em}
.top .back{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.top .back:active{background:var(--line)}

.muted{color:var(--sub);font-size:14px}
.big{font-size:28px;font-weight:700;line-height:1.3}

  background:var(--pri);color:var(--pri-ink);font-weight:700;font-size:17px;padding:10px 16px}
.btn:active{transform:scale(.98)}
.btn.sub{background:var(--pri-soft);color:var(--pri)}

.list .it{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}

h2{font-size:17px;margin:22px 4px 4px}

/* ---- v1.1 追加 ---- */
.qimg{display:block;width:100%;max-height:46vh;object-fit:contain;border-radius:12px;background:#fff;margin:10px 0 2px;border:1px solid var(--line);cursor:zoom-in}

.zoom{position:fixed;inset:0;background:rgba(8,8,16,.92);z-index:40;display:flex;flex-direction:column}
.zoom .zbar{display:flex;gap:8px;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}

.hintline{margin-top:10px;padding:10px 14px;border-radius:12px;background:var(--star-soft);color:var(--ink);font-size:18px;letter-spacing:.12em;font-weight:700;word-break:break-all}
.pad{margin-top:14px}

.padbar{display:flex;gap:8px;margin-top:8px}
.padbar button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px}

.slots.inline{flex-direction:row;flex-wrap:wrap;align-items:center}
.slots.inline .slot{padding:8px 12px}

.unitbar b{flex:1;font-size:16px}
.unitbar button{font-size:13px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.mode{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mode label{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.mode label.on{border-color:var(--pri);background:var(--pri-soft)}
.mode input{margin-top:4px;accent-color:var(--pri);width:20px;height:20px;flex:none}
.steps{margin:8px 0 0;padding-left:1.3em;font-size:14px;color:var(--sub)}
.steps li{margin:2px 0}
.subj{font-size:13px;color:rgba(255,255,255,.9);margin-top:2px}
</style>

<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   まなドリ v1.1 — 間隔反復(Leitner)＋模擬テストの学習アプリ
   ・問題データ（画像つき）は IndexedDB、学習記録は localStorage に保存
     （同じ github.io にある家計簿アプリと localStorage の容量を取り合わないため）
   ・外部への通信はしない（読み上げは端末の音声機能を使う）
   ============================================================ */
const APP_VER = "1.1.0";
const KEY = "manadori:v1";
const INTERVALS = [0, 1, 3, 7, 14, 30];      // box → 次の出題までの日数

/* ---------- 学習記録（localStorage） ---------- */
function defaults(){
  return { prog:{}, days:{}, tests:[],
    settings:{ examDate:"", newPerDay:15, sessionMax:30, answerMode:"type" } };
}
let DB = defaults();
let LEGACY_SETS = null;   // v1.0 で localStorage に入っていた問題データ（移行用）
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d.sets && Object.keys(d.sets).length) LEGACY_SETS = d.sets;
      delete d.sets;
      DB = Object.assign(defaults(), d);
      DB.settings = Object.assign(defaults().settings, d.settings||{});
      if(d.settings && "typeTerms" in d.settings){ delete DB.settings.typeTerms; }
    }
  }catch(e){ console.warn(e); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("記録を保存できませんでした"); }
}

/* ---------- 問題データ（IndexedDB） ---------- */
let SETS = {};
let idb = null;
function idbOpen(){
  return new Promise((res)=>{
    try{
      const r = indexedDB.open("manadori", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("sets");
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    }catch(e){ res(null); }
  });
}
function idbAll(){
  return new Promise((res)=>{
    if(!idb) return res({});
    const out={}, tx=idb.transaction("sets","readonly"), st=tx.objectStore("sets");
    const c=st.openCursor();
    c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } else res(out); };
    c.onerror=()=>res(out);
  });
}
function idbPut(id, val){
  return new Promise((res)=>{
    if(!idb) return res(false);
    const tx=idb.transaction("sets","readwrite"); tx.objectStore("sets").put(val, id);
    tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); tx.onabort=()=>res(false);
  });
}
function idbDel(id){
  return new Promise((res)=>{
    if(!idb) return res(false);
    const tx=idb.transaction("sets","readwrite"); tx.objectStore("sets").delete(id);
    tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
  });
}

/* ---------- 日付 ---------- */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return ymd(new Date()); }
function addDays(s,n){ const [y,m,d]=s.split("-").map(Number); return ymd(new Date(y,m-1,d+n)); }
function diffDays(a,b){ const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}; return Math.round((p(b)-p(a))/864e5); }
function daysToExam(){ const e=DB.settings.examDate; if(!e) return null; return diffDays(today(), e); }

/* ---------- 小物 ---------- */
const $ = s => document.querySelector(s);
const app = () => document.getElementById("app");
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function qtext(s){ return esc(s).replace(/（　+）|\(　+\)/g,'<span class="blank"></span>').replace(/\n/g,"<br>"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function norm(s){ return String(s??"").normalize("NFKC").replace(/[\s　。、・,.!?！？「」]/g,"").toLowerCase(); }
function hira(s){ return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function isEn(s){ return /[A-Za-z]/.test(String(s||"")); }

/* 英語の答えをそろえる：大文字小文字・句読点を無視、短縮形は元の形に */
const CONTR = [["i'm","i am"],["you're","you are"],["we're","we are"],["they're","they are"],["he's","he is"],["she's","she is"],
  ["it's","it is"],["that's","that is"],["what's","what is"],["who's","who is"],["isn't","is not"],["aren't","are not"],
  ["don't","do not"],["doesn't","does not"],["can't","can not"],["cannot","can not"],["won't","will not"],["let's","let us"]];
function enNorm(s, exact){
  let t=String(s??"").normalize("NFKC").toLowerCase().replace(/[’‘`´]/g,"'");
  t=t.replace(/[^a-z0-9' -]/g," ").replace(/\s+/g," ").trim();
  if(!exact){ for(const [a,b] of CONTR) t=t.replace(new RegExp("(^|\\s)"+a.replace("'","'")+"(?=\\s|$)","g"),"$1"+b); t=t.replace(/'/g,""); }
  return t.replace(/-/g," ").replace(/\s+/g," ").trim();
}

/* ---------- 問題の一覧 ---------- */
function allQ(){
  const out=[];
  for(const setId of Object.keys(SETS)){
    const s=SETS[setId];
    s.questions.forEach((q,i)=>out.push(Object.assign({}, q, {
      setId, subject:s.subject, unit:s.unit, ord:i, secKey:s.unit+"｜"+(q.sec||"")})));
  }
  return out;
}
function imgOf(q){ const s=SETS[q.setId]; return q.img && s && s.images ? s.images[q.img] : null; }
function prog(id){ return DB.prog[id]; }
function boxOf(id){ const p=DB.prog[id]; return p?p.box:0; }

/* 採点 → 次の出題日を決める（soft＝ヒントを使って正解：箱は上げずに翌日もう一度） */
function grade(q, ok, soft){
  const t=today();
  const p=DB.prog[q.id]||{box:0,n:0,c:0,hist:""};
  p.n++; if(ok) p.c++;
  if(ok && soft) p.box = Math.max(1, p.box);
  else p.box = ok ? Math.min(p.box+1, 5) : 1;
  let due = addDays(t, ok&&soft ? 1 : INTERVALS[p.box]);
  const e=DB.settings.examDate;
  if(e && e>t){ const lim=addDays(e,-1); if(due>lim) due = lim>addDays(t,1)?lim:addDays(t,1); }
  p.due=due; p.last=t; p.hist=(p.hist+(ok?"1":"0")).slice(-10);
  DB.prog[q.id]=p;
  const d=DB.days[t]||{n:0,c:0,nw:0}; d.n++; if(ok) d.c++; DB.days[t]=d;
  save();
}

/* ---------- 計算問題の自動生成（理科用・データで gen を指定したときだけ使う） ---------- */
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rint(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function r1(x){ return Math.round(x*10)/10; }
function r2(x){ return Math.round(x*100)/100; }
const GENS = {
  density(){
    const m=pick([{n:"アルミニウム",d:2.7},{n:"鉄",d:7.87},{n:"銅",d:8.96},{n:"水",d:1.0},{n:"エタノール",d:0.79}]);
    const V=rint(4,40), mass=r1(m.d*V), kind=pick(["d","m","V"]);
    if(kind==="d") return {q:`質量${mass}g、体積${V}cm³の物質の密度は何g/cm³？（小数第2位まで）`,ans:r2(mass/V),unit:"g/cm³",
      steps:`密度[g/cm³] ＝ 質量[g] ÷ 体積[cm³]\n＝ ${mass} ÷ ${V} ＝ ${r2(mass/V)}`};
    if(kind==="m") return {q:`密度${m.d}g/cm³の${m.n}が${V}cm³ある。質量は何g？（小数第1位まで）`,ans:r1(m.d*V),unit:"g",
      steps:`質量[g] ＝ 密度[g/cm³] × 体積[cm³]\n＝ ${m.d} × ${V} ＝ ${r1(m.d*V)}`};
    return {q:`密度${m.d}g/cm³の${m.n}が${mass}gある。体積は何cm³？（小数第1位まで）`,ans:r1(mass/m.d),unit:"cm³",
      steps:`体積[cm³] ＝ 質量[g] ÷ 密度[g/cm³]\n＝ ${mass} ÷ ${m.d} ＝ ${r1(mass/m.d)}`};
  },
  concentration(){
    const T=pick([100,200,250,400,500]), pct=pick([4,5,8,10,12,15,20,25]), s=T*pct/100, w=T-s;
    if(Math.random()<.6) return {q:`水${w}gに食塩${s}gをとかした。この食塩水の質量パーセント濃度は何％？`,ans:pct,unit:"％",
      steps:`質量パーセント濃度[％] ＝ 溶質の質量 ÷ 溶液の質量 × 100\n溶液 ＝ ${s} ＋ ${w} ＝ ${T}g\n${s} ÷ ${T} × 100 ＝ ${pct}`};
    return {q:`${pct}％の食塩水${T}gにとけている食塩は何g？`,ans:s,unit:"g",
      steps:`溶質の質量 ＝ 溶液の質量 × 濃度 ÷ 100\n＝ ${T} × ${pct} ÷ 100 ＝ ${s}`};
  },
  sound(){
    const v=340, t=pick([2,3,4,5,6,8,10,1.5,2.5]);
    if(Math.random()<.6) return {q:`いなずまが光ってから${t}秒後に雷の音が聞こえた。雷までの距離は何m？（音の速さは${v}m/s）`,ans:r1(v*t),unit:"m",
      steps:`距離[m] ＝ 速さ[m/s] × 時間[s]\n＝ ${v} × ${t} ＝ ${r1(v*t)}`};
    const d=v*t; return {q:`${d}m離れた場所の音が届くまでに何秒かかる？（音の速さは${v}m/s）`,ans:t,unit:"秒",
      steps:`時間[s] ＝ 距離[m] ÷ 速さ[m/s]\n＝ ${d} ÷ ${v} ＝ ${t}`};
  },
  spring(){
    const w1=pick([10,20,25,50]), x1=pick([1,1.5,2,2.5,3,4]), k=pick([2,3,4,1.5,2.5]);
    const w2=w1*k, x2=r1(x1*k);
    return {q:`${w1}gのおもりをつるすと${x1}cmのびるばねがある。${w2}gのおもりをつるすと何cmのびる？`,ans:x2,unit:"cm",
      steps:`ばねののびは、加えた力（おもりの重さ）に比例する（フックの法則）\n${w2} ÷ ${w1} ＝ ${k}倍\n${x1} × ${k} ＝ ${x2}`};
  }
};
function instantiate(q){
  if(q.type!=="calc") return q;
  const g=GENS[q.gen]; if(!g) return Object.assign({},q,{type:"term",q:"（計算テンプレートが見つかりません: "+q.gen+"）",a:"-"});
  return Object.assign({}, q, {calc:g()});
}
function calcOk(input, ans){
  const x=parseFloat(String(input).normalize("NFKC").replace(/[^\d.\-]/g,""));
  if(isNaN(x)) return false;
  return Math.abs(x-ans) <= Math.max(Math.abs(ans)*0.01, 0.001);
}
function termCheck(q, input){
  const cands=[q.a].concat(q.accept||[]);
  if(isEn(q.a)){
    const n=enNorm(input, q.exact); if(!n) return {ok:false};
    for(const c of cands){ if(enNorm(c, q.exact)===n) return {ok:true}; }
    return {ok:false};
  }
  const n=norm(input); if(!n) return {ok:false};
  for(const c of cands){ if(norm(c)===n) return {ok:true}; }
  for(const c of cands){ if(hira(norm(c))===hira(n)) return {ok:true, note:`テストでは「${q.a}」と書こう`}; }
  return {ok:false};
}
function orderOk(q, ans){ return !!ans && ans.length===q.items.length && ans.map(ix=>q.items[ix]).join(" ")===q.items.join(" "); }
function hintText(a){
  if(isEn(a)) return a.split(" ").map(w=>w.replace(/^([^A-Za-z]*[A-Za-z])([A-Za-z']*)/,(m,f,r)=>f+"＿".repeat(r.length))).join("　");
  const ch=[...a]; return ch[0]+"〇".repeat(ch.length-1);
}

let enVoice=null;
function pickVoice(){
  try{ const vs=speechSynthesis.getVoices(); enVoice=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){}
}

function speak(text, slow){
  if(!("speechSynthesis" in window)){ toast("この端末では読み上げが使えません"); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; if(enVoice) u.voice=enVoice; u.rate=slow?0.6:0.9;
    speechSynthesis.speak(u);
  }catch(e){ toast("読み上げできませんでした"); }
}
function sayBtns(text, huge){
  const t=encodeURIComponent(text);
  return huge
    ? `<button class="speak huge" onclick="speak(decodeURIComponent('${t}'))">🔊 もう一度聞く</button>
       <button class="speak slow" onclick="speak(decodeURIComponent('${t}'),true)">🐢 ゆっくり</button>`
    : `<button class="speak" onclick="speak(decodeURIComponent('${t}'))">🔊 発音を聞く</button>`;
}

/* ---------- 手書きパッド ---------- */
let padCtx=null;
function padHTML(){ return `<div class="pad"><canvas id="pad"></canvas>
  <div class="padbar"><button onclick="padUndo()">↩ 1画もどす</button><button onclick="padClear()">🗑 ぜんぶ消す</button></div></div>`; }
function padInit(){
  const c=$("#pad"); if(!c) return;
  const st=session.state; st.strokes=st.strokes||[];
  const dpr=window.devicePixelRatio||1, r=c.getBoundingClientRect();
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const ctx=c.getContext("2d"); ctx.scale(dpr,dpr); padCtx={c,ctx,w:r.width,h:r.height};
  padRedraw();
  let cur=null;
  const pt=e=>{ const b=c.getBoundingClientRect(); return [(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height]; };
  c.onpointerdown=e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); cur=[pt(e)]; st.strokes.push(cur); padRedraw(); };
  c.onpointermove=e=>{ if(!cur) return; e.preventDefault(); cur.push(pt(e)); padRedraw(); };
  c.onpointerup=c.onpointercancel=()=>{ cur=null; };
}
function padRedraw(){
  if(!padCtx) return; const {ctx,w,h}=padCtx, cs=getComputedStyle(document.documentElement);
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle=cs.getPropertyValue("--line").trim()||"#ddd"; ctx.lineWidth=1; ctx.setLineDash([4,6]);
  ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle=cs.getPropertyValue("--ink").trim()||"#222"; ctx.lineWidth=4.5; ctx.lineCap="round"; ctx.lineJoin="round";
  for(const s of (session.state.strokes||[])){
    ctx.beginPath(); s.forEach(([x,y],i)=> i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h));
    if(s.length===1){ ctx.lineTo(s[0][0]*w+0.1,s[0][1]*h+0.1); }
    ctx.stroke();
  }
}
function padUndo(){ (session.state.strokes||[]).pop(); padRedraw(); }
function padClear(){ session.state.strokes=[]; padRedraw(); }

/* ---------- ホーム ---------- */
function dailyPlan(){
  const t=today(), qs=allQ();
  const due=qs.filter(q=>{const p=prog(q.id);return p&&p.box>=1&&p.due<=t;})
              .sort((a,b)=>prog(a.id).due.localeCompare(prog(b.id).due)||boxOf(a.id)-boxOf(b.id));
  const max=DB.settings.sessionMax, dueSel=due.slice(0,max);
  const doneNew=(DB.days[t]&&DB.days[t].nw)||0;
  const newSlots=Math.max(0, Math.min(DB.settings.newPerDay-doneNew, max-dueSel.length));
  // 新しい問題は、教科（問題データ）ごとに順番に混ぜる
  const bySet={}; qs.filter(q=>!prog(q.id)).forEach(q=>(bySet[q.setId] ||= []).push(q));
  const lists=Object.values(bySet), fresh=[];
  for(let k=0; fresh.length<newSlots && lists.some(l=>l.length); k++){ const l=lists[k%lists.length]; if(l.length) fresh.push(l.shift()); }
  return {due:dueSel, fresh, dueAll:due.length};
}
function streak(){
  let s=0, d=today();
  if(!(DB.days[d]&&DB.days[d].n)) d=addDays(d,-1);
  while(DB.days[d]&&DB.days[d].n){ s++; d=addDays(d,-1); }
  return s;
}

/* ---------- 練習セッション ---------- */
function startSession(list, mode, title){
  if(!list.length){ toast("出題できる問題がありません"); return; }
  session={ mode, title, list:list.map(instantiate), i:0, graded:{}, results:[], again:{} , state:{} };
  go("#quiz");
}
function startDaily(){
  const p=dailyPlan();
  startSession(shuffle(p.due.concat(p.fresh)),"daily","今日の学習");
}
function curQ(){ return session.list[session.i]; }
function answerQ(ok, note, soft){
  const q=curQ(), st=session.state;
  st.done=true; st.ok=ok; st.note=note||"";
  if(!session.graded[q.id]){
    const wasNew=!prog(q.id);
    st.prev = DB.prog[q.id] ? JSON.parse(JSON.stringify(DB.prog[q.id])) : null;   // 「正解にする」で元に戻す用
    session.graded[q.id]=true; grade(q, ok, soft);
    if(wasNew){ const d=DB.days[today()]; d.nw=(d.nw||0)+1; save(); }
    session.results.push({q, ok});
  }
  if(!ok && !session.again[q.id]){ session.again[q.id]=true; session.list.push(instantiate(Object.assign({},q,{retry:true}))); }
  renderQuiz();
}
function nextQ(){
  session.i++; session.state={};
  if(session.i>=session.list.length){ go("#done"); return; }
  renderQuiz();
}
function quitSession(){ if(confirm("練習をやめますか？（ここまでの記録は保存されています）")){ session=null; go("#home"); } }

function inputAttrs(en){ return en
  ? `autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" lang="en" placeholder="英語で入力"`
  : `autocomplete="off" spellcheck="false" placeholder="答えを入力"`; }

function renderQuiz(){
  const q=curQ(), st=session.state, total=session.list.length, mode=DB.settings.answerMode||"type";
  const en=q.type==="term" && isEn(q.a);
  const head=`<div class="top"><button class="back" onclick="quitSession()" aria-label="やめる">✕</button>
     <div class="progress"><i style="width:${Math.round(session.i/total*100)}%"></i></div>
     <span class="muted">${session.i+1}/${total}</span></div>`;
  const tags=`<div style="display:flex;gap:6px;flex-wrap:wrap">
     <span class="pill">${esc(q.unit)} ${esc(q.sec||"")}</span>
     ${q.star?`<span class="pill star">★ マーカー</span>`:""}
     ${q.retry?`<span class="pill" style="background:var(--ng-soft);color:var(--ng)">もう一度</span>`:""}</div>`;
  const qhead = imgTag(q) + (q.listen ? `<div class="q">${qtext(q.q)}</div>${sayBtns(q.say,true)}` : `<div class="q ${isEn(q.q)&&!/[ぁ-んァ-ヶ一-龠]/.test(q.q)?"ans-en":""}">${qtext(q.q)}</div>`);
  const sayAfter = q.say && !q.listen && (q.type!=="choice") ? sayBtns(q.say) : "";
  const after = st.done ? `
      <div class="verdict ${st.ok?"ok":"ng"}">${st.ok?(st.soft?"🔺 ヒントありで正解":"⭕ 正解！"):"❌ ざんねん"}</div>
      ${st.note?`<div class="ex" style="color:var(--star)">✏️ ${esc(st.note)}</div>`:""}
      ${q.ex?`<div class="ex">💡 ${esc(q.ex)}</div>`:""}
      ${sayAfter}
      <div class="ex">📘 教科書 ${esc(q.page||"")}</div>
      <div class="spacer"></div><button class="btn" onclick="nextQ()">次へ</button>` : "";
  const hintBox = st.hint ? `<div class="hintline ${en?"ans-en":""}">ヒント：${esc(hintText(q.a))}</div>` : "";
  const ansBox = (mine)=>`<div class="answer"><div class="muted">答え</div><div class="a ${en?"ans-en":""}">${esc(q.a)}</div>${mine||""}</div>`;
  let body="";

  if(q.type==="term"){
    if(mode==="type"){
      body=qhead+(st.done
        ? ansBox(`<div class="muted">あなたの答え：${esc(st.input||"（空欄）")}</div>`)
          + (!st.ok?`<button class="btn ghost" style="margin-top:10px;font-size:14px" onclick="fixOk()">書き方のちがいだけなので正解にする</button>`:"") + after
        : `${hintBox}<input class="field ${en?"ans-en":""}" id="inp" ${inputAttrs(en)} enterkeyhint="done" value="${esc(st.input||"")}" oninput="session.state.input=this.value">
          <div class="spacer"></div><div class="row">
            <button class="btn ghost" onclick="termGiveUp()">わからない</button>
            ${st.hint?"":`<button class="btn sub" onclick="session.state.hint=true;renderQuiz()">ヒント</button>`}
            <button class="btn" onclick="termSubmit()">答える</button></div>`);
    }else if(mode==="pad"){
      body=qhead+(!st.reveal
        ? `${hintBox}${padHTML()}<div class="spacer"></div><div class="row">
            ${st.hint?"":`<button class="btn sub" onclick="session.state.hint=true;renderQuiz()">ヒント</button>`}
            <button class="btn" onclick="padReveal()">答え合わせ</button></div>`
        : `${st.padImg?`<img class="mine" src="${st.padImg}" alt="あなたの答え">`:`<p class="muted">（書かずに答えを見ました）</p>`}
          ${ansBox("")}
          ${st.done?after:`<p class="hint">自分の字と答えをくらべよう。漢字やつづりのまちがいも×にしよう。</p><div class="row">
            <button class="btn ng" onclick="answerQ(false)">✕ まちがえた</button>
            <button class="btn ok" onclick="answerQ(true,'',session.state.hint);session.state.soft=session.state.hint&&session.state.ok;renderQuiz()">○ 書けた</button></div>`}`);
    }else{
      body=qhead+(!st.reveal
        ? `<p class="hint">頭の中で答えを思い出してから、ボタンを押そう</p>
           <button class="btn" onclick="session.state.reveal=true;renderQuiz()">答えを見る</button>`
        : ansBox("")+(st.done?after:`<div class="spacer"></div><div class="row">
              <button class="btn ng" onclick="answerQ(false)">✕ まちがえた</button>
              <button class="btn ok" onclick="answerQ(true)">○ できた</button></div>`));
    }
  }
  else if(q.type==="choice"){
    if(!st.opts) st.opts=shuffle([q.a].concat(q.wrong||[]));
    const enOpts=st.opts.every(o=>isEn(o)&&!/[ぁ-んァ-ヶ一-龠]/.test(o));
    body=qhead+(q.say&&!q.listen?sayBtns(q.say):"")+`<div class="choices">${st.opts.map((o,i)=>{
        let c="choice"+(enOpts?" ans-en":""); if(st.done){ if(o===q.a) c+=" right"; else if(o===st.pick) c+=" wrong"; }
        return `<button class="${c}" ${st.done?"disabled":""} onclick="pickChoice(${i})">${esc(o)}</button>`;}).join("")}</div>${st.done?after.replace(sayAfter,""):""}`;
  }
  else if(q.type==="order"){
    if(!st.pool){ st.pool=shuffle(q.items.map((t,i)=>i)); st.ans=[]; }
    const done=st.done, inl=!!q.inline, cls=inl?" ans-en":"";
    body=qhead+`<div class="muted" style="margin-top:8px">下のカードを、順番にタップしよう</div>
      <div class="slots${inl?" inline":""}">${st.ans.map((ix,k)=>{
        let c="slot"+cls; if(done) c+= (q.items[ix]===q.items[k]?" right":" wrong");
        return `<button class="${c}" ${done?"disabled":""} onclick="orderBack(${k})">${inl?"":`<span class="n">${k+1}</span>`}<span>${esc(q.items[ix])}</span></button>`;}).join("")||'<span class="muted">ここに並びます</span>'}</div>
      ${!done?`<div class="chips">${st.pool.map((ix,k)=>`<button class="chip${cls}" onclick="orderPick(${k})">${esc(q.items[ix])}</button>`).join("")}</div>
        <div class="spacer"></div><button class="btn" ${st.pool.length?"disabled":""} onclick="orderCheck()">答え合わせ</button>`
      :`${!st.ok?`<div class="answer"><div class="muted">正しい順番</div>${inl?`<div class="a ans-en" style="font-size:19px">${esc(q.items.join(" "))}</div>`:q.items.map((t,k)=>`<div>${k+1}. ${esc(t)}</div>`).join("")}</div>`:""}${after}`}`;
  }
  else if(q.type==="write"){
    body=qhead+(!st.reveal?`<textarea class="field" id="wr" placeholder="書いてみよう（ノートに書いてもOK）">${esc(st.text||"")}</textarea>
          <div class="spacer"></div><button class="btn" onclick="writeReveal()">模範解答を見る</button>`
      :`${st.text?`<div class="card" style="margin:12px 0 0;white-space:pre-wrap"><div class="muted">あなたの答え</div>${esc(st.text)}</div>`:""}
        <div class="answer" style="white-space:pre-wrap"><div class="muted">模範解答</div>${esc(q.a)}</div>
        <div class="muted" style="margin-top:14px">書けた（言えた）ポイントにチェックしよう</div>
        ${q.points.map((p,k)=>`<label class="check"><input type="checkbox" ${st.checks&&st.checks[k]?"checked":""} ${st.done?"disabled":""}
            onchange="session.state.checks[${k}]=this.checked"><span>${esc(p)}</span></label>`).join("")}

function answerText(q){
  if(q.type==="choice"||q.type==="term") return q.a;

  if(q.type==="write") return "（模範解答）"+q.a;
  if(q.type==="calc") return q.calc.ans+" "+q.calc.unit;
  return "";
}

/* ---------- 単元練習 ---------- */
function sections(){
  const map=new Map();
  for(const q of allQ()){
    const k=q.secKey;
    if(!map.has(k)) map.set(k,{key:k, subject:q.subject, unit:q.unit, sec:q.sec||"", qs:[]});
    map.get(k).qs.push(q);
  }
  return [...map.values()];
}
function secStats(qs){
  let lv=[0,0,0], n=0, c=0;
  for(const q of qs){ const b=boxOf(q.id); lv[b===0?0:(b>=3?2:1)]++; const p=prog(q.id); if(p){n+=p.n;c+=p.c;} }
  return {lv, rate:n?Math.round(c/n*100):null};
}
function lvBar(lv){ const t=lv[0]+lv[1]+lv[2]||1;
  return `<div class="bar"><i style="width:${lv[2]/t*100}%;background:var(--ok)"></i><i style="width:${lv[1]/t*100}%;background:var(--star)"></i></div>`; }

  const byUnit={}; secs.forEach(s=>{ (byUnit[s.subject+"｜"+s.unit] ||= []).push(s); });

      <button class="it" onclick="openPractice('${encodeURIComponent(k)}',true)"><div class="t"><b>単元まるごと</b>
        <div class="muted">${all.length}問${st.rate!==null?"・正答率 "+st.rate+"％":""}</div>${lvBar(st.lv)}</div><span>›</span></button>
      ${ss.map(s=>{const t=secStats(s.qs); return `<button class="it" onclick="openPractice('${encodeURIComponent(s.key)}',false)"><div class="t"><b>${esc(s.sec)}</b>
        <div class="muted">${s.qs.length}問${t.rate!==null?"・正答率 "+t.rate+"％":""}</div>${lvBar(t.lv)}</div><span>›</span></button>`;}).join("")}
    </div>`;
  }).join("")+`<div class="legend"><span style="--c:var(--ok)">定着（3回以上連続正解）</span><span style="--c:var(--star)">学習中</span><span style="--c:var(--line)">未学習</span></div>`;
}
function openPractice(encKey, isUnit){
  const key=decodeURIComponent(encKey);
  const qs=allQ().filter(q=> isUnit ? (q.subject+"｜"+q.unit)===key : q.secKey===key);
  const filters={
    all:{label:"全部", f:()=>true},
    weak:{label:"苦手だけ", f:q=>{const p=prog(q.id); return p && (p.box<=1 || p.hist.slice(-1)==="0");}},
    star:{label:"★マーカーだけ", f:q=>q.star},
    fresh:{label:"未学習だけ", f:q=>!prog(q.id)},
  };
  if(qs.some(q=>q.img)) filters.img={label:"🗺️ 地図・図表", f:q=>!!q.img};
  if(qs.some(q=>q.listen)) filters.listen={label:"🔊 聞き取り", f:q=>!!q.listen};
  let sel="all";

      <div class="seg">${Object.entries(filters).map(([k,v])=>`<button class="${k===sel?"on":""}" data-k="${k}">${v.label}（${qs.filter(v.f).length}）</button>`).join("")}</div>
      <div class="spacer"></div><button class="btn" ${n?"":"disabled"} id="go">${n}問を始める</button>
      <div class="spacer"></div><button class="btn ghost" id="cl">閉じる</button></div>`;
    bg.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{sel=b.dataset.k;draw();});
    bg.querySelector("#cl").onclick=()=>bg.remove();
    bg.querySelector("#go").onclick=()=>{ bg.remove(); startSession(shuffle(qs.filter(filters[sel].f)),"practice","単元練習"); };
  };
  bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  draw(); document.body.appendChild(bg);
}

/* ---------- 模擬テスト ---------- */
let tsel=null;
function renderTestSetup(){
  const secs=sections();
  if(!secs.length){ app().innerHTML=topbar("模擬テスト","#home")+`<div class="card emptybox"><p>問題データがまだありません</p></div>`; return; }
  const keys=new Set(secs.map(s=>s.key));
  if(!tsel || [...tsel.keys].some(k=>!keys.has(k))){
    const first=secs[0].subject+"｜"+secs[0].unit;   // 最初は1つの単元だけを選んでおく
    tsel={keys:new Set(secs.filter(s=>s.subject+"｜"+s.unit===first).map(s=>s.key)), n:20, min:25};
  }
  const pool=allQ().filter(q=>tsel.keys.has(q.secKey));
  const byUnit={}; secs.forEach(s=>{ (byUnit[s.subject+"｜"+s.unit] ||= []).push(s); });
  app().innerHTML=topbar("模擬テスト","#home")+`
    <div class="card"><b>範囲</b>
      ${Object.entries(byUnit).map(([k,ss])=>`<div class="unitbar"><b>${esc(k.replace("｜","・"))}</b>
          <button onclick="tUnit('${encodeURIComponent(k)}',true)">全部</button><button onclick="tUnit('${encodeURIComponent(k)}',false)">はずす</button></div>
        ${ss.map(s=>`<label class="check"><input type="checkbox" ${tsel.keys.has(s.key)?"checked":""} onchange="tsel.keys[this.checked?'add':'delete'](decodeURIComponent('${encodeURIComponent(s.key)}'));renderTestSetup()">
          <span>${esc(s.sec)}<span class="muted">（${s.qs.length}問）</span></span></label>`).join("")}`).join("")}</div>
    <div class="card"><b>問題数</b><div class="seg">${[10,20,30,0].map(n=>`<button class="${tsel.n===n?"on":""}" onclick="tsel.n=${n};renderTestSetup()">${n||"全部"}</button>`).join("")}</div>
      <div class="spacer"></div><b>制限時間</b><div class="seg">${[10,20,25,50].map(m=>`<button class="${tsel.min===m?"on":""}" onclick="tsel.min=${m};renderTestSetup()">${m}分</button>`).join("")}</div>
      <p class="hint">本番と同じく、終わるまで答えは表示されません。一問一答は文字を入力して答えます（キーボードの手書き入力でもOK）。</p></div>
    <button class="btn" ${pool.length?"":"disabled"} onclick="startTest()">テスト開始（${tsel.n?Math.min(tsel.n,pool.length):pool.length}問・${tsel.min}分）</button>`;
}
function tUnit(enc, on){
  const k=decodeURIComponent(enc);
  sections().filter(s=>s.subject+"｜"+s.unit===k).forEach(s=>tsel.keys[on?"add":"delete"](s.key));
  renderTestSetup();
}
function startTest(){
  const secs=sections().filter(s=>tsel.keys.has(s.key));
  let pool=secs.flatMap(s=>s.qs);
  const N=tsel.n?Math.min(tsel.n,pool.length):pool.length;
  // 苦手・マーカーの問題ほど選ばれやすい重み付きランダム
  const w=q=>{ const p=prog(q.id); return 1+(q.star?1:0)+(p&&p.box<=1?1:0); };
  const wpick=(arr,k)=>arr.map(q=>({q,key:Math.random()**(1/w(q))})).sort((a,b)=>b.key-a.key).slice(0,k).map(x=>x.q);
  // 範囲ごとの問題数を、各範囲の問題数に比例して割り当てる
  const quota=secs.map(s=>({s, k:N===pool.length?s.qs.length:Math.floor(N*s.qs.length/pool.length)}));
  let rest=N-quota.reduce((a,x)=>a+x.k,0);
  for(const x of shuffle(quota)){ if(rest<=0) break; if(x.k<x.s.qs.length){ x.k++; rest--; } }
  let pick=[];
  for(const {s,k} of quota){
    if(!k) continue;
    const heavyMax = N===pool.length ? 99 : (k>=4?1:0);   // 記述・並べ替えは範囲ごとに1問まで
    const heavy=wpick(s.qs.filter(q=>q.type==="write"||q.type==="order"), heavyMax).slice(0,k);
    const light=wpick(s.qs.filter(q=>!heavy.includes(q)&&q.type!=="write"&&q.type!=="order"), k-heavy.length);
    pick=pick.concat(heavy, light);
  }
  const secOrder=secs.map(s=>s.key), typeOrder={term:0,choice:1,calc:2,order:3,write:4};
  pick.sort((a,b)=>secOrder.indexOf(a.secKey)-secOrder.indexOf(b.secKey)||typeOrder[a.type]-typeOrder[b.type]);
  pick=pick.map(q=>Object.assign({},instantiate(q)));
  test={ list:pick, ans:pick.map(()=>null), i:0, start:Date.now(), limit:tsel.min*60000, done:false, saved:false};
  clearInterval(testTimer); testTimer=setInterval(tick,1000);
  go("#test");
}
function tick(){
  if(!test||test.done){ clearInterval(testTimer); return; }
  const left=test.limit-(Date.now()-test.start), el=$("#tm");
  if(left<=0){ toast("時間です！"); submitTest(true); return; }
  if(el){ el.textContent=fmt(left); el.classList.toggle("low", left<60000); }
}
function fmt(ms){ const s=Math.max(0,Math.ceil(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function renderTest(){
  const q=test.list[test.i], a=test.ans[test.i], N=test.list.length, left=test.limit-(Date.now()-test.start);
  const en=q.type==="term" && isEn(q.a);
  let body="";
  if(q.type==="choice"){
    if(!q._opts) q._opts=shuffle([q.a].concat(q.wrong||[]));
    body=`<div class="choices">${q._opts.map((o,i)=>`<button class="choice ${a===o?"sel":""}" onclick="tAns(${i})">${esc(o)}</button>`).join("")}</div>`;
  }else if(q.type==="term"){
    body=`<input class="field ${en?"ans-en":""}" id="tin" ${inputAttrs(en)} value="${esc(a||"")}" oninput="test.ans[test.i]=this.value">`;
  }else if(q.type==="calc"){
    body=`<div class="row" style="align-items:center;margin-top:14px"><input class="field" style="margin:0" id="tin" inputmode="decimal" value="${esc(a||"")}" oninput="test.ans[test.i]=this.value"><b style="flex:0 0 auto">${esc(q.calc.unit)}</b></div>`;
  }else if(q.type==="write"){
    body=`<textarea class="field" id="tin" placeholder="答えを書こう" oninput="test.ans[test.i]=this.value">${esc(a||"")}</textarea>`;
  }else if(q.type==="order"){
    if(!q._pool){ q._pool=shuffle(q.items.map((t,i)=>i)); }
    const ans=a||[], pool=q._pool.filter(ix=>!ans.includes(ix)), inl=!!q.inline, cls=inl?" ans-en":"";
    body=`<div class="slots${inl?" inline":""}">${ans.map((ix,k)=>`<button class="slot${cls}" onclick="tOrd(${k},-1)">${inl?"":`<span class="n">${k+1}</span>`}<span>${esc(q.items[ix])}</span></button>`).join("")||'<span class="muted">カードをタップして順番に並べよう</span>'}</div>
      <div class="chips">${pool.map(ix=>`<button class="chip${cls}" onclick="tOrd(${ix},1)">${esc(q.items[ix])}</button>`).join("")}</div>`;
  }
  const answered=k=>{const v=test.ans[k]; return Array.isArray(v)?v.length>0:!!(v&&String(v).trim());};
  app().innerHTML=`<div class="top"><button class="back" onclick="go('#home')" aria-label="やめる">✕</button>
      <h1 style="font-size:16px">模擬テスト　${test.i+1}/${N}</h1><span class="timer" id="tm">${fmt(left)}</span></div>
    <div class="card"><span class="pill">${esc(q.unit)} ${esc(q.sec||"")}</span>
      ${imgTag(q)}
      <div class="q">問${test.i+1}　${q.type==="calc"?esc(q.calc.q):qtext(q.q)}</div>
      ${q.listen?sayBtns(q.say,true):""}${body}</div>
    <div class="row"><button class="btn sub" ${test.i?"":"disabled"} onclick="tMove(-1)">← 前へ</button>
      ${test.i<N-1?`<button class="btn" onclick="tMove(1)">次へ →</button>`:`<button class="btn ok" onclick="submitTest(false)">提出する</button>`}</div>
    <div class="card"><div class="muted">問題一覧（タップで移動）</div>
      <div class="qnav">${test.list.map((x,k)=>`<button class="${answered(k)?"done":""} ${k===test.i?"cur":""}" onclick="tJump(${k})">${k+1}</button>`).join("")}</div>
      <div class="spacer"></div><button class="btn ghost" onclick="submitTest(false)">提出する</button></div>`;
}
function tAns(i){ const q=test.list[test.i]; test.ans[test.i]=q._opts[i]; renderTest(); }
function tOrd(x,dir){ const a=(test.ans[test.i]||[]).slice(); if(dir>0) a.push(x); else a.splice(x,1); test.ans[test.i]=a; renderTest(); }
function tMove(d){ test.i=Math.max(0,Math.min(test.list.length-1,test.i+d)); renderTest(); window.scrollTo(0,0); }
function tJump(k){ test.i=k; renderTest(); window.scrollTo(0,0); }
function submitTest(timeUp){
  if(!timeUp){
    const blank=test.ans.filter(v=>Array.isArray(v)?!v.length:!(v&&String(v).trim())).length;
    if(!confirm(blank?`未回答が${blank}問あります。提出しますか？`:"提出しますか？")) return;
  }
  clearInterval(testTimer);
  test.done=true; test.used=Math.min(test.limit, Date.now()-test.start);
  test.res=test.list.map((q,k)=>{
    const a=test.ans[k];
    if(q.type==="choice") return {ok:a===q.a?1:0};
    if(q.type==="term"){ const r=termCheck(q,a||""); return {ok:r.ok?1:0, note:r.note}; }
    if(q.type==="calc") return {ok:calcOk(a||"",q.calc.ans)?1:0};
    if(q.type==="order") return {ok:orderOk(q,a)?1:0};
    if(q.type==="write") return {ok:0, self:true, checks:q.points.map(()=>false)};
  });
  test.list.forEach((q,k)=>{ if(q.type!=="write") grade(q, !!test.res[k].ok); });
  saveTest();
  go("#result");
}
function testScore(){ const t=test.res.reduce((s,r)=>s+r.ok,0); return Math.round(t/test.list.length*100); }
function saveTest(){
  const bySec={};

  if(test.saved===false){ DB.tests.push(rec); test.saved=DB.tests.length-1; } else DB.tests[test.saved]=rec;
  save();
}
function wCheck(k,p,v){ const r=test.res[k]; r.checks[p]=v; r.ok=r.checks.filter(Boolean).length/r.checks.length; saveTest(); const el=$("#sc"); if(el) el.textContent=testScore(); }

        <div class="muted" style="white-space:pre-wrap">あなたの答え：${esc(mine||"（空欄）")}</div>
        <div style="color:var(--pri);font-weight:700;white-space:pre-wrap">正解：${esc(answerText(q))}</div>
        ${r.note?`<div class="ex" style="color:var(--star)">✏️ ${esc(r.note)}</div>`:""}
        ${q.type==="calc"?`<div class="ex" style="white-space:pre-wrap">${esc(q.calc.steps)}</div>`:""}
        ${r.self?`<div class="muted" style="margin-top:8px">書けたポイントにチェック（点数に反映）</div>
          ${q.points.map((p,pi)=>`<label class="check"><input type="checkbox" ${r.checks[pi]?"checked":""} onchange="wCheck(${k},${pi},this.checked)"><span>${esc(p)}</span></label>`).join("")}`:""}
        ${q.ex?`<div class="ex">💡 ${esc(q.ex)}</div>`:""}</div>`;}).join("")}
    <button class="btn" onclick="finishTest()">完了してホームへ</button>`;
}
function finishTest(){
  test.list.forEach((q,k)=>{ if(q.type==="write"){ const r=test.res[k]; grade(q, r.ok>=0.6); } });
  test=null; go("#home");
}

/* ---------- 記録 ---------- */
function renderStats(){
  const secs=sections(), t=today();
  let cal=""; const start=addDays(t,-27);
  for(let i=0;i<28;i++){ const d=addDays(start,i), n=(DB.days[d]&&DB.days[d].n)||0;
    const a=n===0?0:n<10?.35:n<25?.65:1;
    cal+=`<i title="${d} ${n}問" style="${n?`background:rgba(75,91,214,${a})`:""};${d===t?"outline:2px solid var(--star)":""}"></i>`; }
  const tot=allQ(), L=secStats(tot);
  const byUnit={}; secs.forEach(s=>{ (byUnit[s.subject+"・"+s.unit] ||= []).push(s); });
  app().innerHTML=topbar("記録","#home")+`
    <div class="card"><b>全体の定着度</b>
      <div style="display:flex;gap:16px;margin:8px 0">
        <div><div class="big" style="color:var(--ok)">${L.lv[2]}</div><div class="muted">定着</div></div>
        <div><div class="big" style="color:var(--star)">${L.lv[1]}</div><div class="muted">学習中</div></div>
        <div><div class="big" style="color:var(--sub)">${L.lv[0]}</div><div class="muted">未学習</div></div>
        <div><div class="big">${L.rate??"-"}${L.rate!==null?"％":""}</div><div class="muted">正答率</div></div></div>
      ${lvBar(L.lv)}</div>
    ${Object.entries(byUnit).map(([u,ss])=>`<div class="card"><b>${esc(u)}</b><table><tr><th>範囲</th><th class="r">正答率</th><th class="r">定着</th></tr>
      ${ss.map(s=>{const x=secStats(s.qs); return `<tr><td>${esc(s.sec)}</td>
        <td class="r">${x.rate??"-"}${x.rate!==null?"％":""}</td><td class="r">${x.lv[2]}/${s.qs.length}</td></tr>`;}).join("")}</table></div>`).join("")}
    <p class="hint" style="margin:0 4px">「定着」＝3回以上続けて正解した問題</p>
    <div class="card"><b>最近4週間</b><div class="muted">色が濃いほどたくさん解いた日</div><div class="cal">${cal}</div></div>
    <div class="card"><b>模擬テストの記録</b>
      ${DB.tests.length?`<table><tr><th>日付</th><th>範囲</th><th class="r">得点</th></tr>
        ${DB.tests.slice().reverse().map(r=>`<tr><td>${r.date.slice(5)}</td><td style="font-size:13px">${esc(r.units||"")}<br><span class="muted">${r.n}問</span></td><td class="r"><b>${r.score}点</b></td></tr>`).join("")}</table>`
      :`<p class="muted">まだありません</p>`}</div>`;
}

/* ---------- 設定 ---------- */
const MODES=[
  ["type","⌨️ 入力して自動で採点（おすすめ）","キーボードの「手書き入力」に切りかえれば、指で書いた字がそのまま入力されて自動で○×がつきます。"],
  ["pad","✍️ 手書きパッドに書いて自分で○×","アプリの中の白いわくに指で書き、答えと見くらべて自分で判定します。漢字やつづりを正しく書く練習向き。"],
  ["recall","💭 思い出すだけ","頭の中で答えを思い出し、答えを見て自分で判定します（いちばん速い）。"]];
function renderSettings(){
  const S=DB.settings, m=S.answerMode||"type";
  app().innerHTML=topbar("設定","#home")+`
    <h2>一問一答の答え方</h2>
    <div class="card"><div class="mode">${MODES.map(([k,t,d])=>`<label class="${m===k?"on":""}"><input type="radio" name="am" ${m===k?"checked":""}
        onchange="DB.settings.answerMode='${k}';save();renderSettings()"><span><b>${t}</b><br><span class="muted">${d}</span></span></label>`).join("")}</div>
      <details style="margin-top:12px"><summary class="muted">キーボードを手書き入力にする方法（Gboardの場合）</summary>
        <ol class="steps"><li>答えの入力欄をタップしてキーボードを出す</li><li>キーボード左上の「⚙（設定）」→「言語」→「日本語」</li>
        <li>「手書き」にチェックを入れて「完了」</li><li>英語も手書きにするなら「キーボードを追加」→「English (US)」→「手書き」</li>
        <li>入力中は 🌐 キーで「手書き」と「ふつうのキーボード」を切りかえ</li></ol>
        <p class="hint">GboardではないAndroidのキーボードでも、多くは同じような手書きモードがあります。</p></details>
    </div>
    <h2>問題データ</h2>
    <div class="card">
      ${Object.keys(SETS).length?`<div class="list">${Object.entries(SETS).map(([id,s])=>`<div class="it"><div class="t">
          <b>${esc(s.subject)}・${esc(s.unit)}</b><div class="muted">${s.questions.length}問${s.images?"・図"+Object.keys(s.images).length+"枚":""}　${esc(s.source||"")}</div></div>
          <button class="btn ghost" style="width:auto;min-height:40px" onclick="delSet('${esc(id)}')">削除</button></div>`).join("")}</div>`
      :`<p class="muted">まだ読み込まれていません</p>`}
      <div class="spacer"></div>
      <label class="btn">ファイルから読み込む<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this.files[0],'data')"></label>
      <div class="spacer"></div>
      <details><summary class="muted">文字を貼り付けて読み込む</summary>
        <textarea class="field" id="paste" placeholder="ここに問題データ（JSON）を貼り付け"></textarea>
        <div class="spacer"></div><button class="btn sub" onclick="importText($('#paste').value,'data')">貼り付けた内容を読み込む</button></details>
      <p class="hint">同じ単元のデータを読み込み直すと、問題は新しくなり、学習記録はそのまま残ります。</p>
    </div>
    <h2>テストと学習量</h2>
    <div class="card">
      <b>テストの日</b>
      <input type="date" class="field" value="${esc(S.examDate)}" onchange="DB.settings.examDate=this.value;save();toast('テストの日を保存しました')">
      <p class="hint">設定すると、テストの前日までに全部の復習が回るように調整します。</p>
      <div class="spacer"></div><b>1日の新しい問題の数</b>
      <div class="seg">${[5,10,15,20,30].map(n=>`<button class="${S.newPerDay===n?"on":""}" onclick="DB.settings.newPerDay=${n};save();renderSettings()">${n}問</button>`).join("")}</div>
      <div class="spacer"></div><b>1回の最大問題数</b>
      <div class="seg">${[20,30,40,60].map(n=>`<button class="${S.sessionMax===n?"on":""}" onclick="DB.settings.sessionMax=${n};save();renderSettings()">${n}問</button>`).join("")}</div>
    </div>
    <h2>記録のバックアップ</h2>
    <div class="card">
      <p class="muted" style="margin-top:0">スマホの「サイトのデータを削除」をすると記録が消えます。ときどき書き出しておくと安心です。</p>
      <button class="btn sub" onclick="exportBackup()">バックアップを書き出す</button>
      <div class="spacer"></div>
      <label class="btn ghost">バックアップから戻す<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this.files[0],'backup')"></label>
      <div class="spacer"></div>
      <button class="btn ghost" style="color:var(--ng)" onclick="resetProgress()">学習記録だけリセット</button>
    </div>
    <p class="muted" style="text-align:center">まなドリ v${APP_VER}　データはこの端末の中にだけ保存されます</p>`;
}
function importFile(file, kind){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>importText(String(r.result), kind);
  r.onerror=()=>toast("ファイルを読めませんでした");
  r.readAsText(file,"utf-8");
}
async function putSet(id, s){
  SETS[id]=s;
  const ok=await idbPut(id, s);
  if(!ok) toast("問題データを端末に保存できませんでした（このまま使えますが、閉じると消えます）");
  return ok;
}
async function importText(text, kind){
  let d; try{ d=JSON.parse(String(text).replace(/^﻿/,"")); }catch(e){ toast("形式が正しくありません（JSONではありません）"); return; }
  if(d && d.format==="manadori-backup" && d.db){
    if(!confirm(kind==="backup"?"今の問題と記録を、バックアップの内容に置きかえますか？":"これはバックアップファイルです。今の記録をすべて置きかえますか？")) return;
    const sets=d.sets || d.db.sets || {};
    delete d.db.sets;
    DB=Object.assign(defaults(), d.db); DB.settings=Object.assign(defaults().settings, d.db.settings||{}); save();
    for(const id of Object.keys(SETS)) await idbDel(id);
    SETS={}; for(const [id,s] of Object.entries(sets)) await putSet(id, s);
    toast("バックアップから戻しました"); renderSettings(); return;
  }
  if(kind==="backup"){ toast("バックアップファイルではありません"); return; }
  if(!d || d.format!=="manadori-v1" || !Array.isArray(d.questions) || !d.set){ toast("まなドリ用の問題データではありません"); return; }
  const bad=d.questions.find(q=>!q.id||!q.type);
  if(bad){ toast("問題データにこわれた部分があります"); return; }
  const isNew=!SETS[d.set];
  await putSet(d.set, {subject:d.subject||"", unit:d.unit||d.set, source:d.source||"", version:d.version||1, lang:d.lang||"", images:d.images||null, questions:d.questions});
  toast(`${d.unit}：${d.questions.length}問を${isNew?"読み込み":"更新し"}ました`);
  renderSettings();
}
async function delSet(id){
  if(!confirm("この単元の問題を削除しますか？（学習記録も消えます）")) return;
  const s=SETS[id]; if(s) s.questions.forEach(q=>delete DB.prog[q.id]);
  delete SETS[id]; await idbDel(id); save(); renderSettings();
}
function exportBackup(){
  const blob=new Blob([JSON.stringify({format:"manadori-backup", ver:APP_VER, saved:new Date().toISOString(), db:DB, sets:SETS})],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`manadori-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast("書き出しました（ダウンロードフォルダ）");
}
function resetProgress(){
  if(!confirm("学習記録と模擬テストの記録を消します。問題データは残ります。よろしいですか？")) return;
  DB.prog={}; DB.days={}; DB.tests=[]; save(); toast("記録をリセットしました"); renderSettings();
}

/* ---------- 起動 ---------- */
(async function boot(){
  load();
  app().innerHTML=`<div class="card emptybox"><p class="muted">読み込み中…</p></div>`;
  idb=await idbOpen();
  SETS=await idbAll();
  if(LEGACY_SETS){   // v1.0 のデータを IndexedDB に引っ越し（学習記録はそのまま）
    for(const [id,s] of Object.entries(LEGACY_SETS)) if(!SETS[id]) await putSet(id, s);
    if(idb) save();   // localStorage から問題データを消して保存し直す
    LEGACY_SETS=null;
  }
  route();
})();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
