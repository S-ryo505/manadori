<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>まなドリ</title>
<meta name="theme-color" content="#FFF7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1922" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="まなドリ">
<style>
@font-face{font-family:"ZenMaru";src:url("zenmaru-Medium.woff2") format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"ZenMaru";src:url("zenmaru-Bold.woff2") format("woff2");font-weight:600 900;font-display:swap}
@font-face{font-family:"Klee One";src:url("klee-SemiBold.woff2") format("woff2");font-weight:400 900;font-display:swap}
:root{
  --bg:#FFF7F4;
  --kfont:"Klee One","UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","Noto Serif JP","Noto Serif CJK JP",serif; --dot:#FBE3EA; --card:#FFFFFF; --ink:#3A3140; --sub:#8A7F8F; --line:#F0E4EA;
  --pri:#9B7FE6; --pri-soft:#F1ECFD; --pri-deep:#7A5CD0; --pri-ink:#FFFFFF; --grad1:#B49CF2; --grad2:#F3A6C8;
  --ok:#2EAE7E; --ok-soft:#E2F6EC; --ng:#F0627E; --ng-soft:#FDE6EB;
  --star:#F2A93B; --star-soft:#FFF2DB;
  --shadow:0 2px 0 rgba(160,120,150,.10),0 8px 22px rgba(160,120,150,.12);
  --r:24px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1C1922;--dot:#26222E;--card:#28242F;--ink:#F2EEF5;--sub:#B2A9B8;--line:#3A3442;
    --pri-soft:#352E48;--ok:#5DD3A2;--ok-soft:#1E3A30;--ng:#FF8BA0;--ng-soft:#47252D;--star:#F5C062;--star-soft:#3E3222;--shadow:none;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"ZenMaru","Hiragino Maru Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;font-weight:500;
  font-size:16px;line-height:1.65;min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px}
b,strong,h1,h2,.big,.btn,.q{font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
#app{max-width:560px;margin:0 auto;padding:10px 16px 48px}
.top{display:flex;align-items:center;gap:8px;min-height:56px}
.top h1{font-size:20px;margin:0;flex:1;letter-spacing:.03em;display:flex;align-items:center;gap:8px;min-width:0}
.top .back,.top .icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--card);box-shadow:var(--shadow);flex:none}
.top .back:active,.top .icon:active{transform:scale(.94)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:14px 0}
@media (prefers-color-scheme:dark){.card,.tile,.top .back,.top .icon{border:1px solid var(--line)}}
.muted{color:var(--sub);font-size:14px}
.big{font-size:28px;line-height:1.3}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;
  background:var(--pri);color:var(--pri-ink);font-size:17px;padding:10px 16px;box-shadow:0 4px 0 var(--pri-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-deep)}
.btn.sub{background:var(--pri-soft);color:var(--pri-deep);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--sub);border:2px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 #1F8A62}.btn.ng{background:var(--ng);color:#fff;box-shadow:0 4px 0 #C94562}
.btn[disabled]{opacity:.4;pointer-events:none}
@media (prefers-color-scheme:dark){.btn.sub{color:var(--pri)}}
.row{display:flex;gap:10px}.row>*{flex:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.grid3.grid4{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile:active{transform:scale(.96)}
.tile .ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:var(--pri-soft)}
.tile b{font-size:14px;line-height:1.3}
.hero{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;position:relative;overflow:hidden}
.hero .muted{color:rgba(255,255,255,.92)}
.hero .btn{background:#fff;color:var(--pri-deep);box-shadow:0 4px 0 rgba(0,0,0,.12);margin-top:14px}
.hero .dori{position:absolute;right:6px;top:4px;opacity:.97}
.hero .heroin{position:relative;z-index:1;padding-right:70px}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri-deep);font-weight:700}
@media (prefers-color-scheme:dark){.pill{color:var(--pri)}}
.pill.star{background:var(--star-soft);color:var(--star)}
.pill.kind{background:transparent;border:1.5px solid var(--line);color:var(--sub)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.progress{height:12px;border-radius:99px;background:var(--card);overflow:hidden;flex:1;box-shadow:inset 0 0 0 2px var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--grad1),var(--pri));border-radius:99px;transition:width .3s}
.q{font-size:19px;line-height:1.75;margin:12px 0 4px;word-break:break-word}
.blank{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--pri);margin:0 .2em}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.choice{text-align:left;padding:14px 16px;border-radius:18px;background:var(--card);border:2.5px solid var(--line);min-height:56px;font-size:16px;font-weight:700;transition:transform .08s}
.choice:active{transform:scale(.98);border-color:var(--pri)}
.choice.sel{border-color:var(--pri);background:var(--pri-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.answer{margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--pri-soft)}
.answer .a{font-size:22px;font-weight:700;color:var(--pri-deep)}
@media (prefers-color-scheme:dark){.answer .a{color:var(--pri)}}
.verdict{font-weight:800;font-size:22px;margin:16px 0 4px;display:flex;align-items:center;gap:8px;position:relative}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.verdict.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.spark{position:absolute;left:18px;top:8px;font-size:16px;pointer-events:none;animation:spark .8s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.ex{font-size:14px;color:var(--sub);margin-top:6px}
.field{width:100%;padding:14px 16px;border-radius:18px;border:2.5px solid var(--line);background:var(--card);font-size:18px;margin-top:14px}
.field:focus{outline:none;border-color:var(--pri)}
textarea.field{font-size:16px;min-height:120px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:10px 14px;border-radius:14px;background:var(--card);border:2.5px solid var(--line);text-align:left;font-size:15px;font-weight:700}
.slots{display:flex;flex-direction:column;gap:8px;margin-top:12px;min-height:60px;padding:10px;border-radius:18px;border:2.5px dashed var(--line)}
.slot{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--pri-soft);text-align:left;font-size:15px;font-weight:700}
.slot .n{font-weight:800;color:var(--pri)}
.slot.right{background:var(--ok-soft)}.slot.wrong{background:var(--ng-soft)}
.slots.inline{flex-direction:row;flex-wrap:wrap;align-items:center}
.slots.inline .slot{padding:8px 12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;border:2px solid var(--line);margin-top:8px;background:var(--card)}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--pri);flex:none}
.list .it{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:2px dotted var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .t{flex:1;min-width:0}
.list button.it{width:100%;text-align:left}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg button{padding:8px 14px;border-radius:14px;border:2.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.seg button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-deep)}
@media (prefers-color-scheme:dark){.seg button.on{color:var(--pri)}}
.sheet-bg{position:fixed;inset:0;background:rgba(40,20,40,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3A3140;color:#fff;padding:12px 18px;border-radius:16px;font-size:15px;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;padding:6px 12px;border-radius:14px;background:var(--card);color:var(--pri-deep);box-shadow:var(--shadow)}
.timer.low{background:var(--ng-soft);color:var(--ng)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal i{aspect-ratio:1;border-radius:8px;background:var(--line);display:block}
.score{font-size:60px;font-weight:800;line-height:1;color:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:2px dotted var(--line);text-align:left}
td.r,th.r{text-align:right}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 4px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.hint{font-size:13px;color:var(--sub);margin-top:8px}
.spacer{height:12px}
h2{font-size:17px;margin:24px 6px 4px}
.emptybox{text-align:center;padding:24px 12px}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.qnav button{height:42px;border-radius:12px;border:2.5px solid var(--line);background:var(--card);font-weight:700}
.qnav button.done{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-deep)}
.qnav button.cur{outline:3px solid var(--star)}
.qimg{display:block;width:100%;max-height:46vh;object-fit:contain;border-radius:16px;background:#fff;margin:10px 0 2px;border:2px solid var(--line);cursor:zoom-in}
.qimg-note{font-size:12px;color:var(--sub);text-align:right}
.zoom{position:fixed;inset:0;background:rgba(20,12,24,.94);z-index:40;display:flex;flex-direction:column}
.zoom .zbar{display:flex;gap:8px;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.zoom .zbar button{background:rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700}
.zoom .zbox{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom .zbox img{width:100%;height:auto;display:block;background:#fff}
.zoom.big .zbox img{width:230%;max-width:none}
.speak{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:16px;background:var(--pri-soft);color:var(--pri-deep);font-weight:700;font-size:15px;margin:10px 6px 0 0}
@media (prefers-color-scheme:dark){.speak{color:var(--pri)}}
.speak.huge{display:flex;width:100%;justify-content:center;padding:22px;font-size:20px;border-radius:20px;margin-right:0}
.speak.slow{background:transparent;border:2px solid var(--line);color:var(--sub)}
.speak.playing{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03);filter:brightness(1.06)}}
.word{font-size:34px;font-weight:700;text-align:center;margin:14px 0 2px;letter-spacing:.02em}
.hintline{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--star-soft);font-size:18px;letter-spacing:.12em;font-weight:700;word-break:break-all}
.pad{margin-top:14px}
.pad canvas{width:100%;height:220px;display:block;border-radius:18px;border:2.5px solid var(--line);background:var(--card);touch-action:none}
.padbar{display:flex;gap:8px;margin-top:8px}
.padbar button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.mine{width:100%;border-radius:16px;border:2px solid var(--line);background:#fff;margin-top:12px}
.ans-en{font-family:"Nunito","Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,"ZenMaru",sans-serif;letter-spacing:.01em}
.unitbar{display:flex;gap:8px;align-items:center;margin:16px 4px 4px}
.unitbar b{flex:1;font-size:16px}
.unitbar button{font-size:13px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700}
.mode{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mode label{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;border:2.5px solid var(--line);background:var(--card)}
.mode label.on{border-color:var(--pri);background:var(--pri-soft)}
.mode input{margin-top:4px;accent-color:var(--pri);width:20px;height:20px;flex:none}
.steps{margin:8px 0 0;padding-left:1.3em;font-size:14px;color:var(--sub)}
.subj{font-size:13px;color:rgba(255,255,255,.95);margin-top:2px}
.excard{margin-top:12px;padding:12px 14px;border-radius:18px;background:var(--card);border:2.5px dashed var(--pri-soft)}
.excard .exen{font-size:18px;font-weight:700;margin-top:2px;line-height:1.5}
.excard .exja{font-size:14px;color:var(--sub);margin-top:2px}
.excard .hl{color:var(--pri-deep);background:linear-gradient(transparent 60%,var(--pri-soft) 60%)}
@media (prefers-color-scheme:dark){.excard .hl{color:var(--pri)}}
.warn{background:var(--ng-soft);border:2px solid var(--ng)}
.verdict.mid{color:var(--star)}
/* ---- ごほうびパズル ---- */
body.gquake #app{animation:gquake .7s linear}
@keyframes gquake{10%,50%,90%{transform:translate(-5px,2px) rotate(-.6deg)}30%,70%{transform:translate(5px,-2px) rotate(.6deg)}100%{transform:none}}
.gintro{animation:gbgin .7s ease-out both}
@keyframes gbgin{0%{background-color:rgba(255,255,255,0)}}
.gwhat{position:absolute;top:16%;font-size:56px;font-weight:800;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.2);animation:gwhat 1.3s ease-out both}
@keyframes gwhat{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.25);opacity:1}40%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.ggive{border:0;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;background:var(--card);color:var(--sub);box-shadow:var(--shadow);margin-left:auto;margin-right:8px;white-space:nowrap}
.gghost rect{opacity:.55}
.gintro{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s}
.gintro.out{opacity:0}
.glogo{width:min(86vw,460px);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:grise 1.9s cubic-bezier(.2,.8,.2,1) .7s both, gfloat 3s ease-in-out 2.6s infinite}
.glogo.small{width:min(60vw,260px);animation:none;box-shadow:var(--shadow)}
@keyframes grise{0%{opacity:0;transform:translateY(70px) scale(.82);filter:blur(10px) brightness(.6)}60%{opacity:1;filter:blur(0) brightness(1.15)}100%{opacity:1;transform:none;filter:none}}
@keyframes gfloat{50%{transform:translateY(-8px)}}
.gintro-gems{animation:grise 1s ease-out 2.3s both;background:rgba(255,255,255,.92);border-radius:18px;padding:10px 14px}
.gemshelf{display:flex;gap:10px;justify-content:center}
.gemcell{display:flex;flex-direction:column;align-items:center;min-width:52px;font-size:12px;color:var(--sub)}
.gemcell b{font-size:18px;color:#3A3140;line-height:1.2}
.gemshelf.big .gemcell b{font-size:24px}
.gamelock{text-align:center}
.gtop h1{font-size:18px}
.hourglass{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:16px;padding:4px 10px 4px 6px;box-shadow:var(--shadow)}
.hourglass .hgt{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.hourglass .hgt b{font-size:20px;font-variant-numeric:tabular-nums}
.hourglass.over{background:var(--ng-soft)}
.glayer{position:relative;margin:4px -16px 0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.gboard{position:absolute;border-radius:14px;background:#1E1A1A;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.gframe{position:absolute}
.gcell{fill:#E9E7EC;stroke:#B9C4D6;stroke-width:1}
.gtray{position:absolute;left:8px;right:8px;border-radius:18px;background:rgba(0,0,0,.04);border:2px dashed var(--line)}
.gpiece{position:absolute;pointer-events:none;transition:left .15s,top .15s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.gpiece svg{display:block}.gpiece rect{pointer-events:auto}
.gpiece.drag{transition:none;z-index:5;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.gpiece.sel .gpc{filter:brightness(1.08)}
.gpiece.sel{z-index:3}
.gpiece.placed{filter:none}
.gctrl{display:flex;gap:10px;margin-top:6px}
.gclear{position:fixed;inset:0;z-index:70;background:rgba(30,20,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.gcbox{background:var(--card);border-radius:28px;padding:22px 18px;text-align:center;width:min(92vw,420px);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.gctitle{font-size:34px;font-weight:800;color:#E2352A}
.gctime{font-size:22px;font-weight:700;margin-bottom:6px}
.gcgem{animation:gspin 1.2s ease-out}
@keyframes gspin{0%{transform:scale(.2) rotate(-40deg);opacity:0}70%{transform:scale(1.15) rotate(8deg);opacity:1}100%{transform:none}}
.gconf{position:absolute;top:-30px;animation:gfall 2.4s ease-in forwards}
@keyframes gfall{to{transform:translateY(110vh) rotate(540deg)}}
.dbgbadge{display:inline-block;margin-left:6px;font-size:12px;padding:2px 8px;border-radius:99px;background:#3A3140;color:#fff}

.prange{display:flex;align-items:center;gap:10px;margin-top:8px}.prange select{margin:0;flex:1}.prange span{font-weight:700}
.krange{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--pri-soft);font-size:15px}
a.btn{text-decoration:none}
.whochip{margin-left:auto;margin-right:6px;padding:8px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px}
.top h1+.whochip{margin-left:auto}
.subjcard.who .sic{font-size:34px}
.momcard{border-color:#FDE8F0}
.ksent{font-size:24px;line-height:2;margin:14px 0 4px;font-weight:700;letter-spacing:.06em}
.ksent .kw{font-family:var(--kfont);color:var(--pri-deep);border-bottom:4px solid var(--pri);padding:0 2px}
.ksent .kbox{display:inline-block;border:3px solid var(--pri);border-radius:8px;padding:0 8px;margin:0 2px;background:var(--pri-soft);line-height:1.6}
.kbig{font-family:var(--kfont);font-size:64px;line-height:1.2;color:var(--ink);font-weight:400}
.kans{text-align:center}
.kpad canvas{margin:0 auto;border-radius:6px;border-width:3px;border-color:var(--pri)}
.zoom.strokes .zbox{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:flex-start;padding:16px}
.kvg{background:#fff;border-radius:16px;padding:8px;width:min(80vw,300px)}
.kvg svg{width:100%;height:auto;display:block}
.kvg .kguide{stroke:#E6DCE3;stroke-width:.6;stroke-dasharray:2 2;fill:none}
.kvg .kbase{stroke:#EFE7EC;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.kvg .kstroke{stroke:#3A3140;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}

<body>
<div id="app"></div>
<script>
"use strict";
/* ============================================================
   まなドリ v1.2
   ・トップページで教科を選ぶ → 教科ごとに「今日の学習」「単元練習」「模擬テスト」「記録」
   ・一問一答は「選ぶ」と「書く」がランダムに出る（教科ごとに割合を設定）
   ・英語の発音は問題データに入っている音声ファイルで再生（端末の読み上げは予備）
   ・問題データ（画像・音声つき）は IndexedDB、学習記録は localStorage
   ============================================================ */
const APP_VER = "1.7.1";
/* ---- プロフィール（中学生／小学生）。記録はプロフィールごとに別々に保存 ---- */
const PKEY = "manadori:profiles";
let PROF = { cur:"chu", momEmail:"", list:[ {id:"chu", name:"中学生", level:"中学", icon:"🎒"}, {id:"sho", name:"小学生", level:"小学", icon:"🐣"} ] };
function loadProfiles(){ try{ const r=localStorage.getItem(PKEY); if(r){ const d=JSON.parse(r); PROF=Object.assign(PROF,d); } }catch(e){} }
function saveProfiles(){ try{ localStorage.setItem(PKEY, JSON.stringify(PROF)); }catch(e){} }
function curProf(){ return PROF.list.find(x=>x.id===PROF.cur)||PROF.list[0]; }
function profKey(id){ return id==="chu" ? "manadori:v1" : "manadori:p:"+id; }
function isKid(){ return curProf().level==="小学"; }
function setLevel(s){ return s.level||"中学"; }
const INTERVALS = [0, 1, 3, 7, 14, 30];
const SUBJECTS_BY_LEVEL = { 中学:["社会", "英語", "理科"], 小学:["漢字"] };
const SUBJECTS = ["社会", "英語", "理科", "漢字"];
const THEMES = {
  社会:{icon:"🌏", c:"#2FB38C", deep:"#1E8F6D", soft:"#E1F6EE", dsoft:"#1F3A33", g1:"#5ACFA6", g2:"#7CC3EC"},
  英語:{icon:"🔤", c:"#F0709F", deep:"#CF4D7E", soft:"#FDE8F0", dsoft:"#47283A", g1:"#F79BC0", g2:"#B9A0F2"},
  理科:{icon:"🧪", c:"#3E9BEA", deep:"#2A7CC6", soft:"#E3F0FD", dsoft:"#21344A", g1:"#6DB6F2", g2:"#86D9CB"},
  漢字:{icon:"✍️", c:"#F27A3D", deep:"#D25A1E", soft:"#FFEBDD", dsoft:"#47301F", g1:"#F8A35E", g2:"#F6C55B"},
  数学:{icon:"📐", c:"#F29A38", deep:"#D27C1D", soft:"#FFF0DD", dsoft:"#47351F", g1:"#F7BA62", g2:"#F59AC0"},
  base:{icon:"✏️", c:"#9B7FE6", deep:"#7A5CD0", soft:"#F1ECFD", dsoft:"#352E48", g1:"#B49CF2", g2:"#F3A6C8"},
};
const MIXV = {few:.3, mid:.5, many:.65};
const MIX_LABEL = {few:"少なめ", mid:"ふつう", many:"多め"};

/* ---------- 学習記録（localStorage） ---------- */
function defaults(){
  const kid = (typeof PROF!=="undefined") && isKid();
  return { prog:{}, days:{}, tests:[], ui:{subj:""},
    settings:{ examDate:"", newPerDay: kid?10:15, sessionMax: kid?20:30, answerMode:"type", requireWrite:true, mix:{社会:"many", 英語:"mid", 理科:"mid"} } };
}
let DB = defaults();
let LEGACY_SETS = null;
function load(){
  DB = defaults();
  try{
    const raw = localStorage.getItem(profKey(PROF.cur));
    if(raw){
      const d = JSON.parse(raw), def=defaults();
      if(d.sets && Object.keys(d.sets).length) LEGACY_SETS = d.sets;
      delete d.sets;
      DB = Object.assign(def, d);
      DB.settings = Object.assign(defaults().settings, d.settings||{});
      DB.settings.mix = Object.assign(defaults().settings.mix, (d.settings||{}).mix||{});
      DB.ui = Object.assign({subj:""}, d.ui||{});
      delete DB.settings.typeTerms;
    }
  }catch(e){ console.warn(e); }
}
function save(){ try{ localStorage.setItem(profKey(PROF.cur), JSON.stringify(DB)); }catch(e){ toast("記録を保存できませんでした"); } }

/* ---------- 問題データ（IndexedDB） ---------- */
let SETS = {}, idb = null;
function idbOpen(){ return new Promise(res=>{ try{ const r=indexedDB.open("manadori",2);
  r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains("sets")) db.createObjectStore("sets");
    if(!db.objectStoreNames.contains("checks")) db.createObjectStore("checks",{keyPath:"k", autoIncrement:true}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }); }
/* 手書きの答え（おうちの人チェック用） */
function chkAdd(rec){ return new Promise(res=>{ if(!idb||!idb.objectStoreNames.contains("checks")) return res(null); const tx=idb.transaction("checks","readwrite"); const rq=tx.objectStore("checks").add(rec);
  rq.onsuccess=()=>res(rq.result); tx.onerror=()=>res(null); }); }
function chkPut(rec){ return new Promise(res=>{ if(!idb||!idb.objectStoreNames.contains("checks")) return res(false); const tx=idb.transaction("checks","readwrite"); tx.objectStore("checks").put(rec); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }
function chkAll(){ return new Promise(res=>{ if(!idb||!idb.objectStoreNames.contains("checks")) return res([]); const out=[], c=idb.transaction("checks","readonly").objectStore("checks").openCursor();
  c.onsuccess=()=>{ const cur=c.result; if(cur){ out.push(cur.value); cur.continue(); } else res(out); }; c.onerror=()=>res(out); }); }
function chkDel(k){ return new Promise(res=>{ if(!idb||!idb.objectStoreNames.contains("checks")) return res(false); const tx=idb.transaction("checks","readwrite"); tx.objectStore("checks").delete(k); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }
let PENDING=0;
async function refreshPending(){ const all=await chkAll(); PENDING=all.filter(r=>r.prof===PROF.cur && !r.mom).length; return PENDING; }
function idbAll(){ return new Promise(res=>{ if(!idb) return res({}); const out={}, c=idb.transaction("sets","readonly").objectStore("sets").openCursor();
  c.onsuccess=()=>{ const cur=c.result; if(cur){ out[cur.key]=cur.value; cur.continue(); } else res(out); }; c.onerror=()=>res(out); }); }
function idbPut(id,val){ return new Promise(res=>{ if(!idb) return res(false); const tx=idb.transaction("sets","readwrite"); tx.objectStore("sets").put(val,id);
  tx.oncomplete=()=>res(true); tx.onerror=tx.onabort=()=>res(false); }); }
function idbDel(id){ return new Promise(res=>{ if(!idb) return res(false); const tx=idb.transaction("sets","readwrite"); tx.objectStore("sets").delete(id);
  tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }

/* ---------- 日付・小物 ---------- */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function today(){ return ymd(new Date()); }
function addDays(s,n){ const [y,m,d]=s.split("-").map(Number); return ymd(new Date(y,m-1,d+n)); }
function diffDays(a,b){ const p=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)}; return Math.round((p(b)-p(a))/864e5); }
function daysToExam(){ const e=DB.settings.examDate; if(!e) return null; return diffDays(today(), e); }
const $ = s => document.querySelector(s);
const app = () => document.getElementById("app");
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function qtext(s){ return esc(s).replace(/（　+）|\(　+\)/g,'<span class="blank"></span>').replace(/\n/g,"<br>"); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function norm(s){ return String(s??"").normalize("NFKC").replace(/[\s　。、・,.!?！？「」]/g,"").toLowerCase(); }
function hira(s){ return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)); }
function isEn(s){ return /[A-Za-z]/.test(String(s||"")); }
function hasJa(s){ return /[ぁ-んァ-ヶ一-龠]/.test(String(s||"")); }
const CONTR = [["i'm","i am"],["you're","you are"],["we're","we are"],["they're","they are"],["he's","he is"],["she's","she is"],
  ["it's","it is"],["that's","that is"],["what's","what is"],["who's","who is"],["isn't","is not"],["aren't","are not"],
  ["don't","do not"],["doesn't","does not"],["can't","can not"],["cannot","can not"],["won't","will not"],["let's","let us"]];
function enNorm(s, exact){
  let t=String(s??"").normalize("NFKC").toLowerCase().replace(/[’‘`´]/g,"'");
  t=t.replace(/[^a-z0-9' -]/g," ").replace(/\s+/g," ").trim();
  if(!exact){ for(const [a,b] of CONTR) t=t.replace(new RegExp("(^|\\s)"+a+"(?=\\s|$)","g"),"$1"+b); t=t.replace(/'/g,""); }
  return t.replace(/-/g," ").replace(/\s+/g," ").trim();
}
function theme(name){ return THEMES[name]||THEMES.base; }
function applyTheme(name){
  const t=theme(name), r=document.documentElement.style, dark=matchMedia("(prefers-color-scheme: dark)").matches;
  r.setProperty("--pri",t.c); r.setProperty("--pri-deep",t.deep); r.setProperty("--pri-soft",dark?t.dsoft:t.soft);
  r.setProperty("--grad1",t.g1); r.setProperty("--grad2",t.g2);
}

/* ---------- 問題の一覧 ---------- */
function allQ(subj){
  const out=[];
  for(const setId of Object.keys(SETS)){
    const s=SETS[setId]; if(setLevel(s)!==curProf().level) continue; if(subj && s.subject!==subj) continue;
    s.questions.forEach((q,i)=>out.push(Object.assign({}, q, {setId, subject:s.subject, unit:s.unit, ord:i, secKey:s.unit+"｜"+(q.sec||"")})));
  }
  return out;
}
function subjectsAll(){ const lv=curProf().level, s=new Set(SUBJECTS_BY_LEVEL[lv]||[]); Object.values(SETS).forEach(x=>{ if(setLevel(x)===lv) s.add(x.subject); }); return [...s]; }
function missingImg(setId){ const s=SETS[setId]; return !!s && s.questions.some(q=>q.img && !(s.images&&s.images[q.img])); }
function imgOf(q){ const s=SETS[q.setId]; return q.img && s && s.images ? s.images[q.img] : null; }
function prog(id){ return DB.prog[id]; }
function boxOf(id){ const p=DB.prog[id]; return p?p.box:0; }
function dayRec(){ const t=today(); const d=DB.days[t]||(DB.days[t]={n:0,c:0}); d.subj ||= {}; return d; }

/* 採点 → 次の出題日。ex.unsure＝わからない／自信なし（明日もう1回）、ex.fmt＝出題形式 */
function needsWrite(q){ return DB.settings.requireWrite!==false && (q.fmts||formatsOf(q)).includes("write"); }
function masteryOk(q,F){
  if(q.type==="kanji" || (q.fmts||[]).includes("kaki")) return F.kaki===1 && (F.yomi===1 || F.yomipick===1);
  return !(needsWrite(q) && F.write!==1);
}
function grade(q, ok, soft, ex){
  ex=ex||{}; const unsure=!!ex.unsure, fmt=ex.fmt||q.fmt;
  const t=today(), p=DB.prog[q.id]||{box:0,n:0,c:0,hist:""};
  const good=ok&&!unsure;
  p.n++; if(good) p.c++;
  p.fmt=p.fmt||{}; if(fmt){ p.fmt[fmt]=(good&&!soft)?1:0; p.lastFmt=fmt; }
  if(unsure || !ok) p.box=1;
  else if(soft) p.box=Math.max(1,p.box);
  else { p.box=Math.min(p.box+1,5); if(!masteryOk(q,p.fmt)) p.box=Math.min(p.box,2); }   // 書いて（漢字は読みと書きの両方で）正解するまでは「定着」にしない
  let due=addDays(t, (unsure||(ok&&soft)) ? 1 : INTERVALS[p.box]);
  const e=DB.settings.examDate;
  if(e && e>t){ const lim=addDays(e,-1); if(due>lim) due = lim>addDays(t,1)?lim:addDays(t,1); }
  p.due=due; p.last=t; p.hist=(p.hist+(good?"1":"0")).slice(-10); DB.prog[q.id]=p;
  const d=dayRec(); d.n++; if(good) d.c++;
  const s=d.subj[q.subject]||(d.subj[q.subject]={n:0,c:0,nw:0}); s.n++; if(good) s.c++;
  save();
}

/* ---------- 計算問題（理科用） ---------- */
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rint(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function r1(x){ return Math.round(x*10)/10; }
function r2(x){ return Math.round(x*100)/100; }
const GENS = {
  density(){ const m=pick([{n:"アルミニウム",d:2.7},{n:"鉄",d:7.87},{n:"銅",d:8.96},{n:"水",d:1.0},{n:"エタノール",d:0.79}]);
    const V=rint(4,40), mass=r1(m.d*V), kind=pick(["d","m","V"]);
    if(kind==="d") return {q:`質量${mass}g、体積${V}cm³の物質の密度は何g/cm³？（小数第2位まで）`,ans:r2(mass/V),unit:"g/cm³",steps:`密度[g/cm³] ＝ 質量[g] ÷ 体積[cm³]\n＝ ${mass} ÷ ${V} ＝ ${r2(mass/V)}`};
    if(kind==="m") return {q:`密度${m.d}g/cm³の${m.n}が${V}cm³ある。質量は何g？（小数第1位まで）`,ans:r1(m.d*V),unit:"g",steps:`質量[g] ＝ 密度[g/cm³] × 体積[cm³]\n＝ ${m.d} × ${V} ＝ ${r1(m.d*V)}`};
    return {q:`密度${m.d}g/cm³の${m.n}が${mass}gある。体積は何cm³？（小数第1位まで）`,ans:r1(mass/m.d),unit:"cm³",steps:`体積[cm³] ＝ 質量[g] ÷ 密度[g/cm³]\n＝ ${mass} ÷ ${m.d} ＝ ${r1(mass/m.d)}`}; },
  concentration(){ const T=pick([100,200,250,400,500]), pct=pick([4,5,8,10,12,15,20,25]), s=T*pct/100, w=T-s;
    if(Math.random()<.6) return {q:`水${w}gに食塩${s}gをとかした。この食塩水の質量パーセント濃度は何％？`,ans:pct,unit:"％",steps:`質量パーセント濃度[％] ＝ 溶質の質量 ÷ 溶液の質量 × 100\n溶液 ＝ ${s} ＋ ${w} ＝ ${T}g\n${s} ÷ ${T} × 100 ＝ ${pct}`};
    return {q:`${pct}％の食塩水${T}gにとけている食塩は何g？`,ans:s,unit:"g",steps:`溶質の質量 ＝ 溶液の質量 × 濃度 ÷ 100\n＝ ${T} × ${pct} ÷ 100 ＝ ${s}`}; },
  sound(){ const v=340, t=pick([2,3,4,5,6,8,10,1.5,2.5]);
    if(Math.random()<.6) return {q:`いなずまが光ってから${t}秒後に雷の音が聞こえた。雷までの距離は何m？（音の速さは${v}m/s）`,ans:r1(v*t),unit:"m",steps:`距離[m] ＝ 速さ[m/s] × 時間[s]\n＝ ${v} × ${t} ＝ ${r1(v*t)}`};
    const d=v*t; return {q:`${d}m離れた場所の音が届くまでに何秒かかる？（音の速さは${v}m/s）`,ans:t,unit:"秒",steps:`時間[s] ＝ 距離[m] ÷ 速さ[m/s]\n＝ ${d} ÷ ${v} ＝ ${t}`}; },
  spring(){ const w1=pick([10,20,25,50]), x1=pick([1,1.5,2,2.5,3,4]), k=pick([2,3,4,1.5,2.5]); const w2=w1*k, x2=r1(x1*k);
    return {q:`${w1}gのおもりをつるすと${x1}cmのびるばねがある。${w2}gのおもりをつるすと何cmのびる？`,ans:x2,unit:"cm",steps:`ばねののびは、加えた力（おもりの重さ）に比例する（フックの法則）\n${w2} ÷ ${w1} ＝ ${k}倍\n${x1} × ${k} ＝ ${x2}`}; }
};
function calcOk(input, ans){ const x=parseFloat(String(input).normalize("NFKC").replace(/[^\d.\-]/g,"")); if(isNaN(x)) return false; return Math.abs(x-ans)<=Math.max(Math.abs(ans)*0.01,0.001); }

/* ---------- 「選ぶ」と「書く」をランダムに出し分ける ---------- */
function scriptClass(s){ s=String(s); if(/^[\d.,]+/.test(s)) return "num"; if(isEn(s)&&!hasJa(s)) return "en"; if(/^[ァ-ヶー・（）()]+$/.test(s)) return "kata"; return "ja"; }
const POOL_CACHE = {};
const ARTICLES=["a","an","the"];
const FAMILY=[["am","is","are","be"],["a","an","the"],["some","others","other","all","many"],["which","what","who","where"],["has","have","having"],["they're","their","there","aren't","isn't","i'm"]];
function kataRatio(s){ const ch=[...String(s)]; return ch.length ? ch.filter(c=>/[ァ-ヶー]/.test(c)).length/ch.length : 0; }
function answerPool(setId){
  if(POOL_CACHE[setId]) return POOL_CACHE[setId];
  const set=SETS[setId], out=new Map();
  for(const q of set.questions){
    if(q.type==="term") out.set(q.a,{s:q.a,sec:q.sec,t:1});
    if(q.type==="choice"){ if(!out.has(q.a)) out.set(q.a,{s:q.a,sec:q.sec}); (q.wrong||[]).forEach(w=>{ if(!out.has(w)) out.set(w,{s:w,sec:q.sec}); }); }
  }
  return POOL_CACHE[setId]=[...out.values()].filter(x=>x.s!=="なし"&&x.s.length<=40);
}
function sameAns(q, s){ const c=[q.a].concat(q.accept||[]); return c.some(x=> isEn(x)&&isEn(s) ? enNorm(x,q.exact)===enNorm(s,q.exact) : norm(x)===norm(s)); }
function numDistract(a){
  const m=String(a).match(/^(\d+)(.*)$/); if(!m) return null;
  const n=+m[1], suf=m[2];
  let c = /^世紀/.test(suf) ? [n-2,n-1,n+1,n+2]
        : n>=1000&&n<=2100 ? [n-10,n+10,n-30,n+20,n-20,n+30] : [n*2, Math.round(n/2), n*3, n+(n>=100?100:n>=10?10:1), Math.round(n*1.5)];
  c=[...new Set(c)].filter(x=>x>0&&x!==n);
  return c.length>=3 ? shuffle(c).slice(0,3).map(x=>x+suf) : null;
}
function makeDistractors(q, cands){
  const a=q.a, nd=numDistract(a); if(nd) return nd;
  const cls=scriptClass(a), L=[...a].length, l2=a.slice(-2), l1=a.slice(-1), multi=/\s/.test(a), kr=kataRatio(a);
  const fam=FAMILY.find(f=>f.includes(a.toLowerCase()));
  const scored=[];
  for(const c of cands){
    const s=c.s; if(sameAns(q,s)) continue;
    if(/^[①-⑳ⓐ-ⓩA-Z]$/.test(s) || /^-/.test(s)) continue;                          // 地図の記号などは使わない
    if(cls==="en" && ARTICLES.includes(s.toLowerCase()) && !ARTICLES.includes(a.toLowerCase())) continue;
    if(s.length>1 && a.length>1 && (s.includes(a)||a.includes(s))) continue;
    let sc=(scriptClass(s)===cls?2:-4)+(s.slice(-2)===l2?3:0)+(s.slice(-1)===l1?1.5:0)+(c.sec===q.sec?1:0)
      -Math.abs([...s].length-L)*0.25-Math.abs(kataRatio(s)-kr)*3+(cls==="en"?(/\s/.test(s)===multi?1.5:-2):0)+Math.random()*1.5;
    if(cls==="en" && s[0].toLowerCase()===a[0].toLowerCase()) sc+=0.8;
    if(cls!=="en" && !c.t) sc-=2.5;                                        // 用語の答えどうしを優先（説明文の選択肢は避ける）
    if(fam && fam.includes(s.toLowerCase())) sc+=5;                        // am / is / are などは同じ仲間から
    scored.push([sc,s]);
  }
  scored.sort((x,y)=>y[0]-x[0]);
  const out=[]; for(const [sc,s] of scored){ if(sc<-1) break; if(!out.some(o=>norm(o)===norm(s))) out.push(s); if(out.length===3) break; }
  return out.length===3 ? out : null;
}
function vocabPool(setId, key){ return SETS[setId].questions.filter(x=>x.vocab).map(x=>({s:x.vocab[key], sec:x.sec})); }
/* ---- 同じ問題を、毎回ちがう聞き方で出す ----
   term   : pick（選ぶ）/ write（書く）/ read（英語→意味、英単語だけ）
   choice : choice（選ぶ）/ write（答えが短い用語なら書く）
   order  : order（ならべる）/ write（英文をまるごと書く、英語の並べ替えだけ）
   まだ正解していない形式を優先し、前回と同じ形式はなるべく避ける。書く形式で正解するまで「定着」にしない。 */
function canWriteChoice(q){
  const a=String(q.a||"");
  if(!a || /^[①-⑳]/.test(a) || a==="なし" || ARTICLES.includes(a.toLowerCase())) return false;
  if(/どれ|選ぼう|選んで|ないもの|正しくない|正しいもの|として正しい/.test(q.q)) return false;
  if(q.passage) return false;                                         // 読解問題は選ぶ形だけ
  if(q.subject==="英語" && !(isEn(a) && !hasJa(a))) return false;     // 英語で日本語を書かせない
  if(isEn(a) && !hasJa(a)) return a.length<=40 && (/（　+）|\(　+\)/.test(q.q) || /英語は？/.test(q.q));
  return [...a].length<=8 && !/[、。・とやの（(〜～％%！!？?]/.test(a) && !/ごろ$|^約/.test(a);
}
function formatsOf(q){
  if(q.fmts) return q.fmts;
  if(q.type==="kanji") return ["yomipick","yomi","kaki"];
  if(q.type==="term") return q.vocab ? ["pick","read","write"] : ["pick","write"];
  if(q.type==="choice") return canWriteChoice(q) ? ["choice","write"] : ["choice"];
  if(q.type==="order") return q.inline ? ["order","write"] : ["order"];

}
function chooseFmt(q, fmts){
  if(fmts.length===1) return fmts[0];
  if(q.type==="kanji"){   // 読み → 書き → 読み … と交互。読みは「選ぶ」から「入力」へ
    const p=prog(q.id); if(!p) return "yomipick";
    const F=p.fmt||{};
    if(p.lastFmt!=="kaki") return "kaki";
    if(F.yomipick!==1) return "yomipick";
    if(F.yomi!==1) return "yomi";
    return Math.random()<.5?"yomi":"yomipick";
  }
  const recog=fmts.filter(f=>f!=="write"), p=prog(q.id);
  if(!p) return pick(recog);                                   // 初めての問題は「選ぶ」から
  const F=p.fmt||{}, notOk=fmts.filter(f=>F[f]!==1);
  if(notOk.length){
    let c=notOk.filter(f=>f!==p.lastFmt); if(!c.length) c=notOk;
    if(c.includes("write") && recog.some(f=>F[f]===1)) return "write";   // 選べたら、次は書く
    return pick(c);
  }
  let c=fmts.filter(f=>f!==p.lastFmt); if(!c.length) c=fmts;  // ぜんぶの形式で正解済み → 前回とちがう形式で
  const rw=MIXV[DB.settings.mix[q.subject]||"mid"]??.5;
  const w=c.map(f=>f==="write"?1-rw:rw/Math.max(1,c.filter(x=>x!=="write").length));
  let r=Math.random()*w.reduce((a,b)=>a+b,0); for(let i=0;i<c.length;i++){ r-=w[i]; if(r<=0) return c[i]; } return c[c.length-1];
}
function buildFmt(q, f){
  const base={fmt:f, fmts:formatsOf(q)};
  if(q.type==="kanji"){
    if(q.alt && q.alt.length) q=Object.assign({},q,{s:pick([q.s].concat(q.alt))});   // 例文は毎回ちがうものを
    if(f==="yomipick"){ const pool=SETS[q.setId].questions.filter(x=>x.type==="kanji").map(x=>({s:x.r, sec:x.sec, t:1}));
      const wrong=makeDistractors({a:q.r, sec:q.sec, accept:[]}, pool) || kanaDistract(q.r);
      return wrong ? Object.assign({},q,base,{type:"choice", kmode:"yomi", q:"――の ことばの 読みかたは？", a:q.r, wrong}) : null; }
    if(f==="yomi") return Object.assign({},q,base,{type:"term", kmode:"yomi", mode:"write", q:"――の ことばの 読みかたを ひらがなで 書こう", a:q.r, accept:[]});
    return Object.assign({},q,base,{type:"term", kmode:"kaki", mode:"write", q:"□の ことばを 漢字で 書こう", a:q.w, accept:[]});
  }
  if(q.type==="term"){
    if(f==="write") return Object.assign({},q,base,{mode:"write"});
    if(f==="read"){ const wrong=makeDistractors({a:q.vocab.ja, sec:q.sec}, vocabPool(q.setId,"ja"));
      return wrong ? Object.assign({},q,base,{type:"choice", mode:"read", q:"この英語の意味は？", word:q.vocab.en, a:q.vocab.ja, accept:[], wrong, say:q.vocab.en}) : null; }
    const wrong=makeDistractors(q, q.vocab ? vocabPool(q.setId,"en") : answerPool(q.setId));
    return wrong ? Object.assign({},q,base,{type:"choice", mode:"pick", q:q.q.replace(/書こう/g,"選ぼう"), wrong}) : null;
  }
  if(q.type==="choice" && f==="write")
    return Object.assign({},q,base,{type:"term", mode:"write", q:q.q.replace(/選ぼう/g,"書こう"), accept:[], wrong:undefined});
  if(q.type==="order" && f==="write")
    return Object.assign({},q,base,{type:"term", mode:"write", q:q.q+"\nこの文を英語で書こう。", a:q.items.join(" "), accept:[], say:q.say||q.items.join(" ")});
  return Object.assign({},q,base);
}
function kanaDistract(r){   // 読みの選択肢が足りないときの予備（にている読み）
  const sw=[["う","っ"],["や","ゃ"],["ゆ","ゅ"],["よ","ょ"],["か","が"],["た","だ"],["は","ば"],["こ","ご"],["し","じ"],["つ","づ"],["う",""],["い",""]];
  const out=new Set();
  for(const [a,b] of shuffle(sw)){ if(r.includes(a)){ const x=r.replace(a,b); if(x && x!==r) out.add(x); } if(b && r.includes(b)){ const x=r.replace(b,a); if(x!==r) out.add(x); } if(out.size>=3) break; }
  const arr=[...out].slice(0,3); return arr.length===3?arr:null;
}
function variant(q){
  if(q.type==="calc"){ const g=GENS[q.gen]; return g ? Object.assign({},q,{calc:g(), fmt:"calc", fmts:["calc"]}) : Object.assign({},q,{type:"term",q:"（計算テンプレートなし）",a:"-"}); }
  if(!SETS[q.setId]) return q;
  const fmts=formatsOf(q); let f=chooseFmt(q,fmts), v=buildFmt(q,f);
  if(!v){ for(const g of shuffle(fmts)){ if(g!==f && (v=buildFmt(q,g))) break; } }
  return v || Object.assign({},q,{fmt:"write", fmts, mode:"write"});
}
function termCheck(q, input){
  const cands=[q.a].concat(q.accept||[]);
  if(isEn(q.a)){ const n=enNorm(input,q.exact); if(!n) return {ok:false}; return {ok:cands.some(c=>enNorm(c,q.exact)===n)}; }
  const n=norm(input); if(!n) return {ok:false};
  if(cands.some(c=>norm(c)===n)) return {ok:true};
  if(cands.some(c=>hira(norm(c))===hira(n))) return {ok:true, note:`テストでは「${q.a}」と書こう`};
  return {ok:false};
}
function orderOk(q, ans){ return !!ans && ans.length===q.items.length && ans.map(ix=>q.items[ix]).join(" ")===q.items.join(" "); }
function hintText(a){
  if(isEn(a)) return a.split(" ").map(w=>w.replace(/^([^A-Za-z]*[A-Za-z])([A-Za-z']*)/,(m,f,r)=>f+"＿".repeat(r.length))).join("　");
  const ch=[...a]; return ch[0]+"〇".repeat(ch.length-1);
}

/* ---------- 音（問題データの音声ファイル → だめなら端末の読み上げ） ---------- */
let enVoice=null, curAudio=null, curBtn=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); enVoice=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null; }catch(e){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function findAudio(text){ for(const s of Object.values(SETS)){ if(s.audio && s.audio[text]) return s.audio[text]; } return null; }
function stopSound(){ try{ if(curAudio){ curAudio.pause(); curAudio=null; } }catch(e){} if(curBtn){ curBtn.classList.remove("playing"); curBtn=null; } }
function speak(text, slow, btn, onEnd){
  stopSound();
  if(btn){ curBtn=btn; btn.classList.add("playing"); }
  let fired=false; const done=()=>{ if(btn) btn.classList.remove("playing"); if(!fired){ fired=true; onEnd&&onEnd(); } };
  const src=findAudio(text);
  if(src){
    const a=new Audio(src); curAudio=a; a.playbackRate=slow?0.7:1; a.preservesPitch=true;
    a.onended=done; a.onerror=()=>ttsSpeak(text,slow,done);
    a.play().catch(()=>ttsSpeak(text,slow,done));
    return;
  }
  ttsSpeak(text, slow, done);
}
let SEQ=0;
function stopAll(){ SEQ++; stopSound(); try{ speechSynthesis.cancel(); }catch(e){} }
function speakSeq(list){   // 単語 → 例文 のように続けて読む
  const l=list.filter(Boolean), my=++SEQ; let i=0;
  const nx=()=>{ if(my!==SEQ || i>=l.length) return; const t=l[i++];
    const btn=document.querySelector(`.speak[data-say="${CSS.escape(encodeURIComponent(t))}"]`);
    speak(t,false,btn,()=>setTimeout(nx,450)); };
  nx();
}
function ttsSpeak(text, slow, done){
  if(!("speechSynthesis" in window)){ toast("音が出ないときは、スマホの音量とマナーモードを確認してね"); done&&done(); return; }
  const go=()=>{ const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; if(enVoice) u.voice=enVoice; u.rate=slow?.6:.9;
    window.__utt=u; u.onend=()=>done&&done(); u.onerror=()=>{ done&&done(); toast("音が出ないときは、スマホの音量とマナーモードを確認してね"); };
    speechSynthesis.speak(u); try{ speechSynthesis.resume(); }catch(e){} };
  if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(go,150); } else go();
}
function sayBtns(text, huge){
  const t=esc(encodeURIComponent(text));
  return huge
    ? `<button class="speak huge" data-say="${t}" onclick="speak(decodeURIComponent(this.dataset.say),false,this)">🔊 聞く</button>
       <button class="speak slow" data-say="${t}" onclick="speak(decodeURIComponent(this.dataset.say),true,this)">🐢 ゆっくり</button>`
    : `<button class="speak" data-say="${t}" onclick="speak(decodeURIComponent(this.dataset.say),false,this)">🔊 発音を聞く</button>`;
}

    z._timers=(z._timers||[]); z._timers.forEach(clearTimeout); z._timers=[];

/* ---------- 手書きパッド ---------- */
let padCtx=null;
function padHTML(cells){ return `<div class="pad${cells?" kpad":""}"><canvas id="pad" ${cells?`data-cells="${cells}"`:""}></canvas>
  <div class="padbar"><button onclick="padUndo()">↩ 1画もどす</button><button onclick="padClear()">🗑 ぜんぶ消す</button></div></div>`; }
const KFONT = '"Klee One","UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","Noto Serif JP","Noto Serif CJK JP",serif';
function padInit(){
  const c=$("#pad"); if(!c) return; const st=session.state; st.strokes=st.strokes||[];
  const cells=+(c.dataset.cells||0);
  if(cells){ const W=c.parentElement.getBoundingClientRect().width, cs=Math.min(Math.floor(W/cells), 210); c.style.width=(cs*cells)+"px"; c.style.height=cs+"px"; }
  const dpr=window.devicePixelRatio||1, r=c.getBoundingClientRect();
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const ctx=c.getContext("2d"); ctx.scale(dpr,dpr); padCtx={c,ctx,w:r.width,h:r.height,cells}; padRedraw();
  let cur=null; const pt=e=>{ const b=c.getBoundingClientRect(); return [(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height]; };
  c.onpointerdown=e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); cur=[pt(e)]; st.strokes.push(cur); padRedraw(); };
  c.onpointermove=e=>{ if(!cur) return; e.preventDefault(); cur.push(pt(e)); padRedraw(); };
  c.onpointerup=c.onpointercancel=()=>{ cur=null; };
}
function padRedraw(){
  if(!padCtx) return; const {ctx,w,h,cells}=padCtx, cs=getComputedStyle(document.documentElement);
  ctx.clearRect(0,0,w,h); ctx.strokeStyle=cs.getPropertyValue("--line").trim()||"#ddd";
  if(cells){   // 漢字ノートのマス目（十字の点線）
    const cw=w/cells; ctx.lineWidth=2; ctx.setLineDash([]); for(let i=1;i<cells;i++){ ctx.beginPath(); ctx.moveTo(i*cw,0); ctx.lineTo(i*cw,h); ctx.stroke(); }
    ctx.lineWidth=1.2; ctx.setLineDash([4,6]); for(let i=0;i<cells;i++){ ctx.beginPath(); ctx.moveTo(i*cw+cw/2,4); ctx.lineTo(i*cw+cw/2,h-4); ctx.moveTo(i*cw+4,h/2); ctx.lineTo(i*cw+cw-4,h/2); ctx.stroke(); }
    ctx.setLineDash([]);
    const st=session&&session.state, q=session&&curQ();
    if(st && st.trace && q){ ctx.fillStyle="rgba(120,120,140,.22)"; ctx.font=`${Math.round(cw*.82)}px ${KFONT}`; ctx.textAlign="center"; ctx.textBaseline="middle";
      [...q.w].forEach((ch,i)=>ctx.fillText(ch, i*cw+cw/2, h/2+cw*.03)); }
  } else { ctx.lineWidth=1.5; ctx.setLineDash([5,7]); ctx.beginPath(); ctx.moveTo(10,h/2); ctx.lineTo(w-10,h/2); ctx.stroke(); ctx.setLineDash([]); }
  ctx.strokeStyle=cs.getPropertyValue("--ink").trim()||"#222"; ctx.lineWidth=cells?Math.max(4.5,h/34):4.5; ctx.lineCap="round"; ctx.lineJoin="round";
  for(const s of (session.state.strokes||[])){ ctx.beginPath(); s.forEach(([x,y],i)=>i?ctx.lineTo(x*w,y*h):ctx.moveTo(x*w,y*h)); if(s.length===1) ctx.lineTo(s[0][0]*w+.1,s[0][1]*h+.1); ctx.stroke(); }
}
function padUndo(){ (session.state.strokes||[]).pop(); padRedraw(); }
function padClear(){ session.state.strokes=[]; padRedraw(); }

function dailyPlan(subj){
  const t=today(), qs=allQ(subj);
  const due=qs.filter(q=>{const p=prog(q.id);return p&&p.box>=1&&p.due<=t;})
              .sort((a,b)=>prog(a.id).due.localeCompare(prog(b.id).due)||boxOf(a.id)-boxOf(b.id));
  const max=DB.settings.sessionMax, dueSel=due.slice(0,max);
  const d=DB.days[t], doneNew=(d&&d.subj&&d.subj[subj]&&d.subj[subj].nw)||0;
  const newSlots=Math.max(0, Math.min(DB.settings.newPerDay-doneNew, max-dueSel.length));
  const bySet={}; qs.filter(q=>!prog(q.id)).sort((a,b)=>(b.miss?1:0)-(a.miss?1:0)).forEach(q=>(bySet[q.setId] ||= []).push(q));   // ドリルでまちがえた言葉を先に
  const lists=Object.values(bySet), fresh=[];
  for(let k=0; fresh.length<newSlots && lists.some(l=>l.length); k++){ const l=lists[k%lists.length]; if(l.length) fresh.push(l.shift()); }
  return {due:dueSel, fresh};
}
function streak(){ let s=0, d=today(); if(!(DB.days[d]&&DB.days[d].n)) d=addDays(d,-1); while(DB.days[d]&&DB.days[d].n){ s++; d=addDays(d,-1); } return s; }

/* ---------- 練習 ---------- */
function startSession(list, mode, title){
  if(!list.length){ toast("出題できる問題がありません"); return; }
  session={ mode, title, list:list.map(variant), i:0, graded:{}, results:[], again:{}, state:{} };
  go("#quiz");
}
function startDaily(){ const p=dailyPlan(SUBJ); startSession(shuffle(p.due.concat(p.fresh)),"daily","今日の"+SUBJ); }
function curQ(){ return session.list[session.i]; }
function requeue(q){ if(session.again[q.id]) return; session.again[q.id]=true; const o=allQ(q.subject).find(x=>x.id===q.id); if(o) session.list.push(Object.assign(variant(o),{retry:true})); }
function answerQ(ok, note, soft, unsure){
  const q=curQ(), st=session.state;
  st.done=true; st.ok=ok&&!unsure; st.unsure=!!unsure; st.soft=!!(ok&&soft&&!unsure); st.note=note||"";
  if(!session.graded[q.id]){
    const wasNew=!prog(q.id);
    st.prev = DB.prog[q.id] ? JSON.parse(JSON.stringify(DB.prog[q.id])) : null;
    session.graded[q.id]=true; grade(q, ok, soft, {unsure, fmt:q.fmt});
    if(wasNew){ const s=dayRec().subj[q.subject]; s.nw=(s.nw||0)+1; save(); }
    session.results.push({q, ok:ok&&!unsure, unsure:!!unsure});
  }
  if(!ok || unsure) requeue(q);
  if(q.kmode==="kaki" && st.padImg && !st.checkKey){
    const rec={prof:PROF.cur, date:today(), ts:Date.now(), qid:q.id, setId:q.setId, w:q.w, r:q.r, s:q.s||"", img:st.padImg,
      self: unsure?"unsure":(ok?(soft?"trace":"ok"):"ng"), mom:null};
    st.checkKey=-1; chkAdd(rec).then(k=>{ st.checkKey=k; session.kaki=(session.kaki||0)+1; refreshPending(); });
  }
  renderQuiz();
  if(ok && !unsure) sparkle();
}
function giveUp(){ const st=session.state; st.input=""; st.reveal=true; st.checks=st.checks||(curQ().points||[]).map(()=>false); answerQ(false,"",false,true); }
function markUnsure(){   // 正解したけど自信がなかった（まぐれ）→ 明日もう1回
  const q=curQ(), st=session.state;
  if("prev" in st){ if(st.prev) DB.prog[q.id]=st.prev; else delete DB.prog[q.id];
    const d=dayRec(); d.n=Math.max(0,d.n-1); d.c=Math.max(0,d.c-1); const s=d.subj[q.subject]; if(s){ s.n=Math.max(0,s.n-1); s.c=Math.max(0,s.c-1); }
    grade(q, true, false, {unsure:true, fmt:q.fmt}); delete st.prev; }
  if(st.checkKey>0) chkAll().then(all=>{ const r=all.find(x=>x.k===st.checkKey); if(r){ r.self="unsure"; chkPut(r); } });
  const r=session.results.find(x=>x.q.id===q.id); if(r){ r.ok=false; r.unsure=true; }
  st.ok=false; st.unsure=true; st.soft=false; requeue(q); renderQuiz();
}
function nextQ(){ stopAll(); session.i++; session.state={}; if(session.i>=session.list.length){ go("#done"); return; } renderQuiz(); }
function quitSession(){ if(confirm("練習をやめますか？（ここまでの記録は保存されています）")){ session=null; go("#home"); } }
function inputAttrs(en){ return en ? `autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" lang="en" placeholder="英語で入力"` : `autocomplete="off" spellcheck="false" placeholder="答えを入力"`; }
function kindPill(q){
  if(q.kmode==="kaki") return `<span class="pill kind">✍️ 書き</span>`;
  if(q.kmode==="yomi") return `<span class="pill kind">👀 読み</span>`;
  if(q.mode==="read") return `<span class="pill kind">👀 読み</span>`;
  if(q.fmt==="write" && (q.fmts||[]).length>1) return `<span class="pill kind">✍️ 書く</span>`;
  if(q.type==="choice") return `<span class="pill kind">☝️ 選ぶ</span>`;
  if(q.type==="term"||q.type==="write") return `<span class="pill kind">✍️ 書く</span>`;
  if(q.type==="order") return `<span class="pill kind">🧩 ならべる</span>`;
  return "";
}

function renderQuiz(){
  const q=curQ(), st=session.state, total=session.list.length, mode=q.kmode==="kaki" ? "pad" : (DB.settings.answerMode||"type");
  const en=q.type==="term" && isEn(q.a);
  const head=`<div class="top"><button class="back" onclick="quitSession()" aria-label="やめる">✕</button>
     <div class="progress"><i style="width:${Math.round(session.i/total*100)}%"></i></div><span class="muted">${session.i+1}/${total}</span></div>`;
  const tags=`<div style="display:flex;gap:6px;flex-wrap:wrap">${kindPill(q)}<span class="pill">${esc(q.unit)}${q.sec&&q.sec!==q.unit?" "+esc(q.sec):""}</span>
     ${q.star?`<span class="pill star">★ マーカー</span>`:""}${q.miss?`<span class="pill star">📌 ドリルでまちがえた</span>`:""}${q.retry?`<span class="pill" style="background:var(--ng-soft);color:var(--ng)">もう一度</span>`:""}</div>`;
  // 答える前に出すのは「聞き取り」と「英語→意味（読み）」のボタンだけ。自動では鳴らさない
  const sayFirst = q.say && (q.listen || q.mode==="read");
  const qhead = imgTag(q) + passageBox(q) + (q.kmode ? kanjiBlock(q) : "") + (q.mode==="read"
      ? `<div class="q">${qtext(q.q)}</div><div class="word ans-en">${esc(q.word)}</div>`
      : `<div class="q ${isEn(q.q)&&!hasJa(q.q)?"ans-en":""}">${qtext(q.q)}</div>`)
    + (sayFirst ? sayBtns(q.say, !!q.listen) : "")
    + (q.say && !sayFirst && !q.passage && !st.done ? `<button class="speak slow" data-say="${esc(encodeURIComponent(q.say))}" onclick="session.state.hint=true;speak(decodeURIComponent(this.dataset.say),false,this)">🔊 発音を聞く（ヒント）</button>` : "");
  const sayAfter = q.say && !sayFirst ? sayBtns(q.say) : "";
  const after = st.done ? `
      <div class="verdict ${st.unsure?"mid pop":st.ok?"ok pop":"ng pop"}">${st.unsure?"🤔 だいじょうぶ、明日もう1回出すね":st.ok?(st.soft?"🔺 ヒントありで正解":"⭕ 正解！"):"💦 ざんねん"}</div>
      ${st.ok && !st.soft ? `<button class="btn ghost unsure" onclick="markUnsure()">🤔 じつは自信なかった（明日もう1回）</button>` : ""}
      ${q.kmode==="kaki" && st.checkKey ? `<div class="ex">👩 この字は おうちの人チェックに 送ったよ</div>` : ""}
      ${st.note?`<div class="ex" style="color:var(--star)">✏️ ${esc(st.note)}</div>`:""}
      ${q.ex?`<div class="ex">💡 ${esc(q.ex)}</div>`:""}${sayAfter}${exCard(q)}${q.kmode&&q.kmode!=="kaki"?`<div class="answer kans"><div class="kbig">${esc(q.w)}</div><div class="muted">${esc(q.r)}</div></div>${strokeBtn(q)}`:""}
      ${q.page?`<div class="ex">📘 教科書 ${esc(q.page)}</div>`:""}
      <div class="spacer"></div><button class="btn" onclick="nextQ()">次へ ▶</button>` : "";
  const hintBox = st.hint ? `<div class="hintline ${en?"ans-en":""}">ヒント：${esc(hintText(q.a))}</div>` : "";
  const unsureBtn = `<button class="btn ghost unsure" onclick="giveUp()">🤔 わからない（明日もう1回）</button>`;
  const unsureBtn2 = `<button class="btn ghost unsure" onclick="giveUp()">🤔 自信ない（明日もう1回）</button>`;
  const ansBox = mine=>q.kmode==="kaki"
    ? `<div class="answer kans"><div class="muted">正しい字</div><div class="kbig">${esc(q.a)}</div><div class="muted">${esc(q.r)}</div>${mine||""}</div>`
    : `<div class="answer"><div class="muted">答え</div><div class="a ${en?"ans-en":""}">${esc(q.a)}</div>${mine||""}</div>`;
  let body="";
  if(q.type==="term"){
    if(mode==="type"){
      body=qhead+(st.done
        ? ansBox(`<div class="muted">あなたの答え：${esc(st.input||"（空欄）")}</div>`)
          +(!st.ok?`<button class="btn ghost" style="margin-top:10px;font-size:14px" onclick="fixOk()">書き方のちがいだけなので正解にする</button>`:"")+after

function renderDone(){

function answerText(q){
  if(q.kmode) return q.w+"（"+q.r+"）";
  if(q.type==="choice"||q.type==="term") return q.a;
  if(q.type==="order") return q.inline ? q.items.join(" ") : q.items.map((t,i)=>(i+1)+"."+t).join(" → ");

  if(q.type==="calc") return q.calc.ans+" "+q.calc.unit;

/* ---------- 漢字の50問テスト（前半：読み／後半：書き） ---------- */
let K=null, KSEL=null, KTIMER=null;
function renderKTestSetup(){
  const secs=sections("漢字");
  if(!secs.length){ app().innerHTML=topbar("📝 50問テスト","#home")+`<div class="card emptybox"><p>漢字の問題データがまだありません</p></div>`; return; }

      ${Object.entries(byUnit).map(([u,ss])=>`<div class="unitbar"><b>${esc(u)}</b>

        ${ss.map(s=>`<label class="check"><input type="checkbox" ${KSEL.keys.has(s.key)?"checked":""} onchange="KSEL.keys[this.checked?'add':'delete'](decodeURIComponent('${encodeURIComponent(s.key)}'));KSEL.pa=KSEL.pb=undefined;renderKTestSetup()">
          <span>${esc(s.sec)}<span class="muted">（${s.qs.length}語）</span></span></label>`).join("")}`).join("")}</div>
    <div class="card"><b>問題数</b><div class="seg">${[20,30,50,0].map(n=>`<button class="${KSEL.n===n?"on":""}" onclick="KSEL.n=${n};renderKTestSetup()">${n?n+"問":"言葉の数だけ"}</button>`).join("")}</div>
      <div class="spacer"></div><b>時間</b><div class="seg">${[0,30,45].map(m=>`<button class="${KSEL.min===m?"on":""}" onclick="KSEL.min=${m};renderKTestSetup()">${m?m+"分":"なし"}</button>`).join("")}</div>
      <div class="krange">${P?`えらんだ範囲：<b>${P}語</b> → <b>${N}問</b>（読み${ny}・書き${nk}）`:"範囲がえらばれていません"}
        ${P&&N>P?`<br><span class="muted">言葉が${KSEL.n}語より少ないので、${N-P}語は「読み」と「書き」の両方で出ます（例文はかえます）。</span>`:""}
        ${P&&KSEL.n&&KSEL.n>P*2?`<br><span class="muted">この範囲では、最大${P*2}問です。</span>`:""}</div>

function kUnit(enc,on){ const u=decodeURIComponent(enc); sections("漢字").filter(s=>s.unit===u).forEach(s=>KSEL.keys[on?"add":"delete"](s.key)); KSEL.pa=KSEL.pb=undefined; renderKTestSetup(); }
function kPool(){ return allQ("漢字").filter(q=>KSEL.keys.has(q.secKey)); }
function kCount(P){ return KSEL.n ? Math.min(KSEL.n, P*2) : P; }   // 最大で「ことばの数×2」（読み＋書き）
/* ページ番号での範囲指定（単元名の「p.5〜8」から読み取る） */
function secPages(sec){ const m=String(sec).match(/p\.(\d+)(?:〜(\d+))?/); return m?[+m[1], +(m[2]||m[1])]:null; }
function kPageList(){ const ps=new Set(); sections("漢字").forEach(s=>{ const r=secPages(s.sec); if(r){ ps.add(r[0]); ps.add(r[1]); } }); return [...ps].sort((a,b)=>a-b); }
function kSetPages(which){

  if(a>b){ if(which==="a") b=a; else a=b; }   // 入れかわらないように、動かしていない方を合わせる
  const lo=a, hi=b;
  KSEL.keys=new Set(sections("漢字").filter(s=>{ const r=secPages(s.sec); return r && r[1]>=lo && r[0]<=hi; }).map(s=>s.key));

}
function kWeight(q){ const p=prog(q.id); let w=1; if(q.miss) w+=2; if(!p) w+=.5; else if(p.box<=1) w+=2; else if(p.box>=4) w-=.5; return Math.max(.3,w); }

function startKTest(list){
  let items;

  else{
    const pool=kPool(), P=pool.length, N=kCount(P), ny=Math.ceil(N/2);
    if(N<=P){   // 範囲のことばが足りる：同じことばは1回だけ
      const chosen=shuffle(kPick(pool,N));
      items=chosen.map((q,i)=>Object.assign({},q,{kmode:i<ny?"yomi":"kaki"}));
    }else{      // 足りない：全部のことばを出し、一部は読みと書きの両方で（例文は変える）

        items.push(Object.assign({},q,{kmode:"yomi", s:ss[0], fixS:true}), Object.assign({},q,{kmode:"kaki", s:ss[1]||ss[0], fixS:true})); });
      rest.forEach((q,i)=>items.push(Object.assign({},q,{kmode:i<ry?"yomi":"kaki"})));
    }
    items=shuffle(items).sort((a,b)=>(a.kmode==="yomi"?0:1)-(b.kmode==="yomi"?0:1));
  }
  items=items.map(q=>q.fixS?q:Object.assign(q,{s:q.alt&&q.alt.length?pick([q.s].concat(q.alt)):q.s}));
  K={list:items, ans:items.map(()=>""), st:items.map(()=>({strokes:[]})), uns:items.map(()=>false), i:0, start:Date.now(), limit:(list?0:KSEL.min)*60000, done:false, fin:false};

/* 書いた線を画像にする（チェック用） */
function strokesToImg(strokes, cells){
  if(!strokes||!strokes.length) return null;
  const cs=150, w=cs*cells, h=cs, c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.strokeStyle="#E6DCE3"; x.lineWidth=2;
  for(let i=1;i<cells;i++){ x.beginPath(); x.moveTo(i*cs,0); x.lineTo(i*cs,h); x.stroke(); }
  x.setLineDash([5,7]); for(let i=0;i<cells;i++){ x.beginPath(); x.moveTo(i*cs+cs/2,4); x.lineTo(i*cs+cs/2,h-4); x.moveTo(i*cs+4,h/2); x.lineTo(i*cs+cs-4,h/2); x.stroke(); } x.setLineDash([]);
  x.strokeStyle="#2A2430"; x.lineWidth=Math.max(5,h/30); x.lineCap="round"; x.lineJoin="round";
  for(const s of strokes){ x.beginPath(); s.forEach(([px,py],i)=>i?x.lineTo(px*w,py*h):x.moveTo(px*w,py*h)); if(s.length===1) x.lineTo(s[0][0]*w+.1,s[0][1]*h+.1); x.stroke(); }
  return c.toDataURL("image/png");
}

/* ============================================================
   ごほうびパズル（ゆずんゴ／ここんゴ）
   ・12種類のブロックから4つを選び、それがぴったり入る枠をその場で作る（必ず解ける）
   ・今日の学習（ノルマ）を全部終えると、1日1回だけ遊べる
   ・30秒の砂時計。10秒以内＝赤／15秒＝青／20秒＝緑／30秒＝黄のダイヤ
   ============================================================ */
const PIECES = {
  O4:{c:"#E2352A", cells:[[0,0],[1,0],[0,1],[1,1]]},
  L5:{c:"#B8237A", cells:[[0,0],[1,0],[2,0],[3,0],[0,1]]},
  I2:{c:"#A21F6A", cells:[[0,0],[1,0]]},
  S4:{c:"#2D6CB2", cells:[[1,0],[2,0],[0,1],[1,1]]},
  L4:{c:"#A6C93A", cells:[[0,0],[0,1],[1,1],[2,1]]},
  T4:{c:"#E3D11F", cells:[[0,0],[1,0],[2,0],[1,1]]},
  Z5:{c:"#E9B52C", cells:[[0,0],[0,1],[1,1],[2,1],[2,2]]},
  Y5:{c:"#E2861F", cells:[[1,0],[0,1],[1,1],[2,1],[3,1]]},
  I4:{c:"#A87528", cells:[[0,0],[1,0],[2,0],[3,0]]},
  I3:{c:"#2C9BE0", cells:[[0,0],[1,0],[2,0]]},
  P5:{c:"#2C9A45", cells:[[1,0],[2,0],[0,1],[1,1],[2,1]]},
  V3:{c:"#23977A", cells:[[0,0],[0,1],[1,1]]},
};
const GEMS = [ {k:"red", t:10, c:"#E8344E", name:"赤"}, {k:"blue", t:15, c:"#3D7BEA", name:"青"}, {k:"green", t:20, c:"#2DB36B", name:"緑"}, {k:"yellow", t:30, c:"#F2C230", name:"黄色"} ];
const GAME_LIMIT = 30;
function gameInfo(){ return isKid() ? {name:"ここんゴ", en:"KOKONGO", img:"kokongo.jpg", bg:"#D9533F"} : {name:"ゆずんゴ", en:"YUZUNGO", img:"yuzungo.jpg", bg:"#DE5B47"}; }
function gameData(){ DB.game ||= {gems:{red:0,blue:0,green:0,yellow:0}, last:"", cleared:[], plays:0, cur:null}; DB.game.gems ||= {red:0,blue:0,green:0,yellow:0}; return DB.game; }
function isDebug(){ try{ return localStorage.getItem("manadori:debug")==="1"; }catch(e){ return false; } }

/* ---- 形のあつかい ---- */
function pnorm(cells){ const mx=Math.min(...cells.map(c=>c[0])), my=Math.min(...cells.map(c=>c[1]));
  return cells.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]); }
function prot(cells){ return pnorm(cells.map(([x,y])=>[-y,x])); }      // 時計回り90°
function pflip(cells){ return pnorm(cells.map(([x,y])=>[-x,y])); }     // 左右反転
function pkey(cells){ return pnorm(cells).map(c=>c.join(",")).join(";"); }
function porients(cells){ const out=[], seen=new Set(); let c=pnorm(cells);
  for(let f=0;f<2;f++){ for(let r=0;r<4;r++){ const k=pkey(c); if(!seen.has(k)){ seen.add(k); out.push(c); } c=prot(c); } c=pflip(c); } return out; }
function pdim(cells){ return [Math.max(...cells.map(c=>c[0]))+1, Math.max(...cells.map(c=>c[1]))+1]; }

/* ---- 枠を作る：4つのブロックを実際にくっつけて置いた形（＝必ず解ける） ---- */
function genPuzzle(avoid){
  const ids=Object.keys(PIECES);
  for(let tryN=0; tryN<600; tryN++){
    const pick4=shuffle(ids).slice(0,4), area=pick4.reduce((s,id)=>s+PIECES[id].cells.length,0);
    if(area<13 || area>18) continue;                       // ちょうどよい大きさ（13〜18マス）
    const order=shuffle(pick4).sort((a,b)=>PIECES[b].cells.length-PIECES[a].cells.length);
    const occ=new Set(), place={}; const K=(x,y)=>x+","+y;
    let ok=true;
    for(const id of order){
      const cand=[];
      for(const o of porients(PIECES[id].cells)){
        if(!occ.size){ cand.push({o,dx:0,dy:0,score:0}); continue; }
        const xs=[...occ].map(s=>+s.split(",")[0]), ys=[...occ].map(s=>+s.split(",")[1]);
        for(let dx=Math.min(...xs)-4; dx<=Math.max(...xs)+1; dx++) for(let dy=Math.min(...ys)-4; dy<=Math.max(...ys)+1; dy++){
          if(o.some(([x,y])=>occ.has(K(x+dx,y+dy)))) continue;
          if(!o.some(([x,y])=>[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>occ.has(K(x+dx+a,y+dy+b))))) continue;
          const all=[...occ].map(s=>s.split(",").map(Number)).concat(o.map(([x,y])=>[x+dx,y+dy]));
          const w=Math.max(...all.map(c=>c[0]))-Math.min(...all.map(c=>c[0]))+1, h=Math.max(...all.map(c=>c[1]))-Math.min(...all.map(c=>c[1]))+1;
          if(w>6||h>6) continue;
          const S=new Set(all.map(c=>K(c[0],c[1]))); let per=0; all.forEach(([x,y])=>[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{ if(!S.has(K(x+a,y+b))) per++; }));
          cand.push({o,dx,dy,score:per*1.0+w*h*0.35+Math.random()*2.2});
        }
      }
      if(!cand.length){ ok=false; break; }
      cand.sort((a,b)=>a.score-b.score);
      const c=cand[Math.floor(Math.random()*Math.min(4,cand.length))];
      c.o.forEach(([x,y])=>occ.add(K(x+c.dx,y+c.dy))); place[id]=c.o.map(([x,y])=>[x+c.dx,y+c.dy]);
    }
    if(!ok) continue;
    let cells=[...occ].map(s=>s.split(",").map(Number)); const mx=Math.min(...cells.map(c=>c[0])), my=Math.min(...cells.map(c=>c[1]));
    cells=cells.map(([x,y])=>[x-mx,y-my]); const [w,h]=pdim(cells);
    if(w>6||h>5&&w>5||h>6) continue;
    if(hasHole(cells,w,h)) continue;                       // 穴のある枠はつくらない
    const sig=pick4.slice().sort().join("+")+"|"+pkey(cells);
    if(avoid && avoid.includes(sig)) continue;
    const sol={}; for(const id in place) sol[id]=place[id].map(([x,y])=>[x-mx,y-my]);
    return {pieces:pick4, cells, w, h, sig, sol};
  }
  return null;
}
function hasHole(cells,w,h){
  const F=new Set(cells.map(c=>c.join(","))), seen=new Set(), st=[[-1,-1]];
  while(st.length){ const [x,y]=st.pop(), k=x+","+y; if(seen.has(k)||F.has(k)||x<-1||y<-1||x>w||y>h) continue; seen.add(k); st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]); }
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const k=x+","+y; if(!F.has(k)&&!seen.has(k)) return true; } return false;
}

  o.forEach(([x,y])=>{ r+=`<rect x="${x*cs}" y="${y*cs}" width="${cs+.5}" height="${cs+.5}" fill="${col}"/>`;
    if(!S.has(`${x},${y-1}`)) edge+=`M${x*cs},${y*cs}h${cs}`; if(!S.has(`${x},${y+1}`)) edge+=`M${x*cs},${(y+1)*cs}h${cs}`;
    if(!S.has(`${x-1},${y}`)) edge+=`M${x*cs},${y*cs}v${cs}`; if(!S.has(`${x+1},${y}`)) edge+=`M${(x+1)*cs},${y*cs}v${cs}`; });
  el.style.width=w*cs+"px"; el.style.height=h*cs+"px";

    <g opacity=".22">${o.map(([x,y])=>`<rect x="${x*cs+3}" y="${y*cs+3}" width="${cs-6}" height="${cs-6}" fill="none" stroke="#fff" stroke-dasharray="2 5"/>`).join("")}</g>
    <path d="${edge}" stroke="rgba(0,0,0,.45)" stroke-width="2" fill="none" stroke-linecap="square"/></svg>`;

}
function slotPos(id){
  const i=GZ.puz.pieces.indexOf(id), col=i%2, row=Math.floor(i/2), [w,h]=pdim(GZ.orient[id]), cs=GZ.cs;
  return [Math.round(col*GZ.slotW+(GZ.slotW-w*cs)/2), Math.round(GZ.ty+row*GZ.slotH+(GZ.slotH-h*cs)/2)];
}
function toTray(id){ GZ.place[id]=null; const [x,y]=slotPos(id), el=$("#gp-"+id); el.style.left=x+"px"; el.style.top=y+"px"; el.classList.remove("placed"); }
function putAt(id,gx,gy){ GZ.place[id]=[gx,gy]; const el=$("#gp-"+id); el.style.left=(GZ.bx+gx*GZ.cs)+"px"; el.style.top=(GZ.by+gy*GZ.cs)+"px"; el.classList.add("placed"); }
function fitsAt(id,gx,gy){
  const F=new Set(GZ.puz.cells.map(c=>c.join(","))), occ=new Set();
  for(const k of GZ.puz.pieces){ if(k===id||!GZ.place[k]) continue; const [px,py]=GZ.place[k]; GZ.orient[k].forEach(([x,y])=>occ.add((x+px)+","+(y+py))); }
  return GZ.orient[id].every(([x,y])=>{ const s=(x+gx)+","+(y+gy); return F.has(s)&&!occ.has(s); });
}
// はなした場所（マス単位の小数）から一番近い「ぴったり入る」場所。1マス半より遠ければ null（置き場に戻す）
function nearestFit(id,fx,fy){
  let best=null, bd=1e9;
  for(let gx=Math.floor(fx)-1; gx<=Math.ceil(fx)+1; gx++) for(let gy=Math.floor(fy)-1; gy<=Math.ceil(fy)+1; gy++){
    const d=Math.hypot(gx-fx,gy-fy); if(d<=1.5 && d<bd && fitsAt(id,gx,gy)){ bd=d; best=[gx,gy]; } }
  return best;
}
function bindPiece(id){
  const el=$("#gp-"+id); let st=null;
  el.onpointerdown=e=>{
    if(GZ.done) return; e.preventDefault(); el.setPointerCapture(e.pointerId);
    GZ.sel=id; GZ.puz.pieces.forEach(k=>$("#gp-"+k).classList.toggle("sel",k===id));
    const r=el.getBoundingClientRect(); st={x0:e.clientX, y0:e.clientY, ox:e.clientX-r.left, oy:e.clientY-r.top, t0:Date.now(), moved:false, L:$("#glayer").getBoundingClientRect()};
    el.classList.add("drag");
  };
  el.onpointermove=e=>{
    if(!st) return; e.preventDefault();
    if(Math.hypot(e.clientX-st.x0,e.clientY-st.y0)>12) st.moved=true;
    if(!st.moved) return;
    const lift=GZ.cs*.55;
    el.style.left=(e.clientX-st.L.left-st.ox)+"px"; el.style.top=(e.clientY-st.L.top-st.oy-lift)+"px";
  };
  el.onpointerup=el.onpointercancel=e=>{
    if(!st) return; el.classList.remove("drag"); const s=st; st=null;
    if(!s.moved){ gRotate(id); return; }                      // タップ＝まわす
    const x=parseFloat(el.style.left), y=parseFloat(el.style.top);
    const p=nearestFit(id,(x-GZ.bx)/GZ.cs,(y-GZ.by)/GZ.cs);
    if(p) putAt(id,p[0],p[1]); else toTray(id);
    gCheck();
  };
}

function gFlip(id){ id=id||GZ.sel||GZ.puz.pieces[0]; if(GZ.done) return; GZ.sel=id; reorient(id, pflip(GZ.orient[id])); }

/* ---------- 単元練習 ---------- */
function sections(subj){

function tUnit(enc,on){ const u=decodeURIComponent(enc); sections(SUBJ).filter(s=>s.unit===u).forEach(s=>tsel.keys[on?"add":"delete"](s.key)); renderTestSetup(); }
function startTest(){
  const secs=sections(SUBJ).filter(s=>tsel.keys.has(s.key)), pool=secs.flatMap(s=>s.qs);
  const N=tsel.n?Math.min(tsel.n,pool.length):pool.length;
  const w=q=>{ const p=prog(q.id); return 1+(q.star?1:0)+(p&&p.box<=1?1:0); };
  const wpick=(arr,k)=>arr.map(q=>({q,key:Math.random()**(1/w(q))})).sort((a,b)=>b.key-a.key).slice(0,k).map(x=>x.q);
  const quota=secs.map(s=>({s, k:N===pool.length?s.qs.length:Math.floor(N*s.qs.length/pool.length)}));
  let rest=N-quota.reduce((a,x)=>a+x.k,0);
  for(const x of shuffle(quota)){ if(rest<=0) break; if(x.k<x.s.qs.length){ x.k++; rest--; } }
  let pk=[];
  for(const {s,k} of quota){ if(!k) continue;
    const heavy=wpick(s.qs.filter(q=>q.type==="write"||q.type==="order"), N===pool.length?99:(k>=4?1:0)).slice(0,k);
    pk=pk.concat(heavy, wpick(s.qs.filter(q=>!heavy.includes(q)&&q.type!=="write"&&q.type!=="order"), k-heavy.length)); }
  pk=pk.map(q=>Object.assign({},variant(q)));
  const secOrder=secs.map(s=>s.key), typeOrder={choice:0,term:1,calc:2,order:3,write:4};
  pk.sort((a,b)=>secOrder.indexOf(a.secKey)-secOrder.indexOf(b.secKey)||typeOrder[a.type]-typeOrder[b.type]);
  test={ list:pk, ans:pk.map(()=>null), uns:pk.map(()=>false), i:0, start:Date.now(), limit:tsel.min*60000, done:false, saved:false };
  clearInterval(testTimer); testTimer=setInterval(tick,1000); go("#test");
}
function tick(){ if(!test||test.done){ clearInterval(testTimer); return; } const left=test.limit-(Date.now()-test.start), el=$("#tm");

        <input class="field" style="margin:0" value="${esc(pf.name)}" onchange="PROF.list[${i}].name=this.value||PROF.list[${i}].name;saveProfiles()">
        <span class="muted" style="white-space:nowrap">${pf.level}</span></div>`).join("")}
      <p class="hint">いまは「${esc(curProf().name)}」の設定と記録を表示しています。切りかえはトップページの名前ボタンから。</p>
      <b>おうちの人のメールアドレス</b>
      <input class="field" type="email" placeholder="例：mama@example.com" value="${esc(PROF.momEmail||"")}" onchange="PROF.momEmail=this.value.trim();saveProfiles();toast('保存しました')">
      <p class="hint">漢字の「チェック表を送る」で使います。スマホの共有メニューが使えるときは、そこからメールやLINEを選べます。</p></div>
    <h2>問題の出し方</h2>
    <div class="card">${subjectsAll().map(s=>`<div style="display:flex;align-items:center;gap:10px;margin:6px 0">
        <b style="width:4em">${theme(s).icon} ${esc(s)}</b><div class="seg" style="margin:0">${Object.keys(MIXV).map(k=>`<button class="${(S.mix[s]||"mid")===k?"on":""}" onclick="DB.settings.mix['${esc(s)}']='${k}';save();renderSettings()">${MIX_LABEL[k]}</button>`).join("")}</div></div>`).join("")}
      <p class="hint">同じ問題でも「選ぶ」「書く」「読み（英語→意味）」「ならべる」など、毎回ちがう聞き方で出ます。初めての問題は選ぶ形から始まり、選べたら次は書く形で出ます。ここの設定は、全部の形で正解したあとの出し方です。</p>
      <label class="check"><input type="checkbox" ${S.requireWrite!==false?"checked":""} onchange="DB.settings.requireWrite=this.checked;save()">
        <span><b>書いて正解するまで「定着」にしない</b><br><span class="muted">選択式でまぐれ当たりしても、定着あつかいにならないようにします（おすすめ）</span></span></label></div>
    <h2>書く問題の答え方</h2>
    <div class="card"><div class="mode">${MODES.map(([k,t,d])=>`<label class="${m===k?"on":""}"><input type="radio" name="am" ${m===k?"checked":""}
        onchange="DB.settings.answerMode='${k}';save();renderSettings()"><span><b>${t}</b><br><span class="muted">${d}</span></span></label>`).join("")}</div>
      <details style="margin-top:12px"><summary class="muted">キーボードを手書き入力にする方法（Gboardの場合）</summary>
        <ol class="steps"><li>答えの入力欄をタップしてキーボードを出す</li><li>キーボードの「⚙（設定）」→「言語」→「日本語」</li>
        <li>「手書き」にチェックを入れて「完了」</li><li>英語も手書きにするなら「キーボードを追加」→「English (US)」→「手書き」</li>
        <li>入力中は 🌐 キーで「手書き」と「ふつうのキーボード」を切りかえ</li></ol></details></div>
    <h2>音のテスト</h2>
    <div class="card"><button class="speak" onclick="speak('Hello! Let\\'s study English.',false,this)">🔊 英語の音を出してみる</button>
      <p class="hint">音が出ないときは、①スマホの音量（メディアの音量）を上げる ②マナーモードを解除 ③英語の問題データを読み込み直す、を試してね。</p></div>
    <h2>問題データ</h2>
    <div class="card">
      ${Object.keys(SETS).length?`<div class="list">${Object.entries(SETS).map(([id,s])=>`<div class="it"><div class="t">
          <b>${theme(s.subject).icon} ${esc(s.subject)}・${esc(s.unit)}</b> <span class="pill">${esc(setLevel(s))}</span><div class="muted">${s.questions.length}問${s.images?"・図"+Object.keys(s.images).length+"枚":""}${s.audio?"・音声"+Object.keys(s.audio).length:""}${s.version?"・ver."+s.version:""}</div>${missingImg(id)?`<div style="color:var(--ng);font-size:13px;font-weight:700">⚠️ 図が入っていません。読み込み直してね</div>`:""}</div>
          <button class="btn ghost" style="width:auto;min-height:40px" onclick="delSet('${esc(id)}')">削除</button></div>`).join("")}</div>`:`<p class="muted">まだ読み込まれていません</p>`}
      <div class="spacer"></div>
      <label class="btn">ファイルから読み込む<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this.files[0],'data')"></label>
      <p class="hint">同じ単元のデータを読み込み直すと、問題は新しくなり、学習記録はそのまま残ります。</p></div>
    <h2>テストと学習量</h2>
    <div class="card"><b>テストの日</b>
      <input type="date" class="field" value="${esc(S.examDate)}" onchange="DB.settings.examDate=this.value;save();toast('テストの日を保存しました')">
      <div class="spacer"></div><b>1日の新しい問題の数（教科ごと）</b>
      <div class="seg">${[5,10,15,20,30].map(n=>`<button class="${S.newPerDay===n?"on":""}" onclick="DB.settings.newPerDay=${n};save();renderSettings()">${n}問</button>`).join("")}</div>
      <div class="spacer"></div><b>1回の最大問題数</b>
      <div class="seg">${[20,30,40,60].map(n=>`<button class="${S.sessionMax===n?"on":""}" onclick="DB.settings.sessionMax=${n};save();renderSettings()">${n}問</button>`).join("")}</div></div>
    <h2>記録のバックアップ</h2>
    <div class="card"><p class="muted" style="margin-top:0">スマホの「サイトのデータを削除」をすると記録が消えます。ときどき書き出しておくと安心です。</p>
      <button class="btn sub" onclick="exportBackup()">バックアップを書き出す</button><div class="spacer"></div>
      <label class="btn ghost">バックアップから戻す<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this.files[0],'backup')"></label>
      <div class="spacer"></div><button class="btn ghost" style="color:var(--ng)" onclick="resetProgress()">学習記録だけリセット</button></div>
    ${isDebug()?`<h2>🛠 デバッグ</h2><div class="card"><button class="btn" onclick="GRET='#settings';go('#game')">🎮 ${esc(gameInfo().name)}をためす</button>
      <p class="muted" style="margin-bottom:0">デバッグ中はノルマなしで何回でも遊べます（ダイヤは記録されません）。このボタンはデバッグ中だけ表示されます。</p></div>`:""}
    <p class="muted" style="text-align:center;user-select:none" onclick="dbgTap()">まなドリ v${APP_VER}${isDebug()?'<span class="dbgbadge">🛠 デバッグ</span>':""}　データはこの端末の中にだけ保存されます</p>`;
}
function importFile(file, kind){ if(!file) return; const r=new FileReader(); r.onload=()=>importText(String(r.result),kind); r.onerror=()=>toast("ファイルを読めませんでした"); r.readAsText(file,"utf-8"); }
async function putSet(id,s){ SETS[id]=s; delete POOL_CACHE[id]; const ok=await idbPut(id,s); if(!ok) toast("問題データを端末に保存できませんでした"); return ok; }
async function importText(text, kind){
  let d; try{ d=JSON.parse(String(text).replace(/^﻿/,"")); }catch(e){ toast("形式が正しくありません（JSONではありません）"); return; }
  if(d && d.format==="manadori-backup" && d.db){
    if(!confirm(kind==="backup"?"今の問題と記録を、バックアップの内容に置きかえますか？":"これはバックアップファイルです。今の記録をすべて置きかえますか？")) return;
    const sets=d.sets||d.db.sets||{}; delete d.db.sets;
    const def=defaults(); DB=Object.assign(def,d.db); DB.settings=Object.assign(defaults().settings,d.db.settings||{}); DB.settings.mix=Object.assign(defaults().settings.mix,(d.db.settings||{}).mix||{}); save();
    for(const id of Object.keys(SETS)) await idbDel(id); SETS={}; for(const [id,s] of Object.entries(sets)) await putSet(id,s);
    toast("バックアップから戻しました"); renderSettings(); return;
  }
  if(kind==="backup"){ toast("バックアップファイルではありません"); return; }
  if(!d || d.format!=="manadori-v1" || !Array.isArray(d.questions) || !d.set){ toast("まなドリ用の問題データではありません"); return; }
  if(d.questions.find(q=>!q.id||!q.type)){ toast("問題データにこわれた部分があります"); return; }
  const isNew=!SETS[d.set];
  await putSet(d.set,{subject:d.subject||"", unit:d.unit||d.set, level:d.level||"中学", source:d.source||"", version:d.version||1, lang:d.lang||"", images:d.images||null, audio:d.audio||null, strokes:d.strokes||null, credits:d.credits||"", questions:d.questions});
  toast(`${d.subject}・${d.unit}：${d.questions.length}問を${isNew?"読み込み":"更新し"}ました`); renderSettings();
}
async function delSet(id){ if(!confirm("この単元の問題を削除しますか？（学習記録も消えます）")) return;
  const s=SETS[id]; if(s) s.questions.forEach(q=>delete DB.prog[q.id]); delete SETS[id]; await idbDel(id); save(); renderSettings(); }
function exportBackup(){
  const blob=new Blob([JSON.stringify({format:"manadori-backup", ver:APP_VER, saved:new Date().toISOString(), db:DB, sets:SETS})],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`manadori-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); toast("書き出しました（ダウンロードフォルダ）");
}
function resetProgress(){ if(!confirm("学習記録と模擬テストの記録を消します。問題データは残ります。よろしいですか？")) return; DB.prog={}; DB.days={}; DB.tests=[]; save(); toast("記録をリセットしました"); renderSettings(); }

/* ---------- 起動 ---------- */
(async function boot(){
  loadProfiles(); load();
  app().innerHTML=`<div class="card emptybox">${doriSVG("normal",80)}<p class="muted">読み込み中…</p></div>`;
  idb=await idbOpen(); SETS=await idbAll();
  if(LEGACY_SETS){ for(const [id,s] of Object.entries(LEGACY_SETS)) if(!SETS[id]) await putSet(id,s); if(idb) save(); LEGACY_SETS=null; }
  SUBJ = DB.ui.subj && subjectsAll().includes(DB.ui.subj) ? DB.ui.subj : "";
  await refreshPending();
  let asked=false; try{ asked=!!sessionStorage.getItem("manadori:who"); }catch(e){}
  if(!location.hash || ["#quiz","#done","#test","#result","#mom"].includes(location.hash)) history.replaceState(null,"","#top");
  if(!asked) history.replaceState(null,"","#who");   // アプリを開いたら、まず「だれが べんきょうする？」
  route();
})();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>route());
if("serviceWorker" in navigator && location.protocol.startsWith("http")){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
